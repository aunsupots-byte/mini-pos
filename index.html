<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบ POS มือถือเต็มรูปแบบ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen pb-24">

    <div class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-40">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <span class="font-bold text-base">📱 ระบบขายหน้าร้าน</span>
            <div class="flex space-x-1">
                <button onclick="openUnpaidModal()" class="bg-red-700 hover:bg-red-800 text-[11px] font-bold py-1.5 px-2.5 rounded-lg shadow transition">
                    🚨 ค้างชำระ
                </button>
                <button onclick="openHistoryModal()" class="bg-blue-800 hover:bg-blue-900 text-[11px] font-bold py-1.5 px-2.5 rounded-lg shadow transition">
                    📊 ยอดขายรายวัน
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto p-3 space-y-3">

        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 space-y-2">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-600">กล้องสแกนบาร์โค้ด</span>
                <button id="cameraToggleBtn" onclick="toggleCamera()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold py-1 px-3 rounded-full shadow transition">
                    🟢 กล้องเปิดอยู่ (คลิกปิด)
                </button>
            </div>
            <div id="reader" class="w-full bg-black rounded-lg overflow-hidden min-h-[160px]"></div>
            <div id="scan-status" class="text-center text-xs font-semibold text-slate-500">[ พร้อมสแกนสินค้า ]</div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">👤 ชื่อผู้ซื้อ / ลูกค้า</label>
                <input type="text" id="customerName" value="ทั่วไป" class="w-full p-2.5 bg-yellow-50 border border-yellow-300 rounded-lg text-sm font-medium text-slate-800" placeholder="ระบุชื่อลูกค้า (ถ้าค้างชำระจำเป็นต้องใส่)">
            </div>
            
            <hr class="border-slate-100">

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">รหัสบาร์โค้ด</label>
                    <input type="text" id="barcode" class="w-full p-2 bg-slate-50 border rounded-lg text-xs font-mono" placeholder="สแกนหรือพิมพ์" onchange="fetchProductData(this.value)">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">ราคา/ชิ้น (บาท)</label>
                    <input type="number" id="price" class="w-full p-2 border rounded-lg text-right font-bold text-blue-600 text-xs" placeholder="0.00">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">ชื่อสินค้า</label>
                <input type="text" id="productName" class="w-full p-2 border rounded-lg text-xs" placeholder="ชื่อสินค้า">
            </div>
            <div class="flex space-x-2">
                <div class="w-1/2">
                    <input type="number" id="quantity" value="1" min="1" class="w-full p-2 border rounded-lg text-center font-bold text-xs">
                </div>
                <button type="button" onclick="addToCart()" class="w-1/2 bg-blue-500 text-white text-xs font-bold rounded-lg shadow">➕ เพิ่มรายการ</button>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2">
            <h3 class="text-xs font-bold text-slate-700 flex justify-between"><span>📋 รายการในบิลนี้</span><button onclick="clearCart()" class="text-red-500 font-normal">ล้างตะกร้า</button></h3>
            <div id="cart-list" class="text-xs space-y-1 max-h-32 overflow-y-auto divide-y divide-slate-100"></div>
            <div class="bg-slate-50 p-2 rounded flex justify-between items-center text-sm font-bold"><span>ยอดรวมบิล:</span><span id="grand-total" class="text-emerald-600 text-lg">0.00 ฿</span></div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2">
            <label class="block text-xs font-bold text-slate-600">สถานะ/ช่องทางการชำระเงิน</label>
            <select id="payment" class="w-full p-2.5 border rounded-lg text-xs bg-white font-medium">
                <option value="โอนเงิน">💸 โอนเงินผ่านธนาคาร</option>
                <option value="เงินสด">💵 เงินสด</option>
                <option value="ยังไม่ได้ชำระเงิน">🚨 ยังไม่ได้ชำระเงิน (ค้างชำระ/แปะโป้ง)</option>
            </select>
            <button type="button" id="checkoutBtn" onclick="submitOrder()" disabled class="w-full bg-slate-400 text-white font-bold py-3.5 rounded-xl text-sm shadow cursor-not-allowed">🛍️ ยืนยันการขาย</button>
        </div>
    </div>

    <div id="historyModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0"><div class="bg-white w-full max-w-md rounded-t-2xl max-h-[85vh] flex flex-col shadow-xl"><div class="p-4 border-b flex justify-between items-center bg-slate-50 rounded-t-2xl"><h2 class="font-bold text-slate-800 text-sm">📊 ประวัติยอดขายรายวัน</h2><button onclick="closeModal('historyModal')" class="text-slate-400 font-bold p-1">✕</button></div><div id="history-content" class="p-4 overflow-y-auto flex-1 space-y-4 text-xs"></div></div></div>

    <div id="unpaidModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0">
        <div class="bg-white w-full max-w-md rounded-t-2xl max-h-[85vh] flex flex-col shadow-xl">
            <div class="p-4 border-b flex justify-between items-center bg-red-50 rounded-t-2xl">
                <h2 class="font-bold text-red-700 text-sm flex items-center gap-1">🚨 รายชื่อลูกค้าที่ยังไม่ได้ชำระเงิน</h2>
                <button onclick="closeModal('unpaidModal')" class="text-slate-400 font-bold p-1">✕</button>
            </div>
            <div id="unpaid-content" class="p-4 overflow-y-auto flex-1 space-y-3 text-xs">
                </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx92ov484ob-O4ncwwjpzhD2E5wgwmuhAguCRD8gBiVpyhCiyqLru0LTCqlnHjwHhtFvg/exec"; 
        let cart = [];
        let html5Qrcode;
        let isCameraOpen = false;

        // ------------------ ฟังก์ชัน เปิด-ปิด กล้องสแกน ------------------
        function startCamera() {
            html5Qrcode = new Html5Qrcode("reader");
            html5Qrcode.start(
                { facingMode: "environment" }, 
                { fps: 12, qrbox: { width: 250, height: 130 } }, 
                onScanSuccess, 
                () => {}
            ).then(() => {
                isCameraOpen = true;
                document.getElementById('cameraToggleBtn').innerText = "🟢 กล้องเปิดอยู่ (คลิกปิด)";
                document.getElementById('cameraToggleBtn').className = "bg-emerald-500 text-white text-xs font-bold py-1 px-3 rounded-full shadow";
            }).catch(err => console.error("เปิดกล้องไม่สำเร็จ", err));
        }

        function stopCamera() {
            if (html5Qrcode && isCameraOpen) {
                html5Qrcode.stop().then(() => {
                    isCameraOpen = false;
                    document.getElementById('reader').innerHTML = ""; // เคลียร์หน้าจอแคนวาสกล้อง
                    document.getElementById('cameraToggleBtn').innerText = "🔴 กล้องปิดอยู่ (คลิกเปิด)";
                    document.getElementById('cameraToggleBtn').className = "bg-red-500 text-white text-xs font-bold py-1 px-3 rounded-full shadow";
                }).catch(err => console.error("ปิดกล้องไม่สำเร็จ", err));
            }
        }

        function toggleCamera() {
            if (isCameraOpen) { stopCamera(); } else { startCamera(); }
        }

        // เริ่มต้นให้เปิดกล้องอัตโนมัติเมื่อเข้าเว็บครั้งแรก
        window.addEventListener('DOMContentLoaded', startCamera);

        function onScanSuccess(text) { if (navigator.vibrate) navigator.vibrate(80); document.getElementById('barcode').value = text; fetchProductData(text); }
        function fetchProductData(bc) { if(!bc) return; fetch(`${WEB_APP_URL}?barcode=${bc}`).then(r=>r.json()).then(d=>{ if(d.found){ document.getElementById('productName').value=d.name; document.getElementById('price').value=d.price; } }); }
        
        // ------------------ ตะกร้าสินค้า ------------------
        function addToCart() { 
            const b=document.getElementById('barcode').value, n=document.getElementById('productName').value, p=parseFloat(document.getElementById('price').value), q=parseInt(document.getElementById('quantity').value); 
            if(!b||!n||isNaN(p)) return; 
            cart.push({barcode:b,name:n,price:p,quantity:q}); 
            updateCartUI(); 
            document.getElementById('barcode').value=""; document.getElementById('productName').value=""; document.getElementById('price').value=""; 
        }
        
        function updateCartUI() { 
            const l=document.getElementById('cart-list'); let h="", t=0; 
            cart.forEach((item,i)=>{ t+=(item.price*item.quantity); h+=`<div class='flex justify-between py-1 text-xs'><span>${item.name} x${item.quantity}</span><span>${(item.price*item.quantity).toFixed(2)} ฿</span></div>`; }); 
            l.innerHTML=cart.length?h:"<p class='text-slate-400 text-center py-2'>ไม่มีสินค้าในตะกร้า</p>"; 
            document.getElementById('grand-total').innerText=t.toFixed(2)+" ฿"; 
            const btn=document.getElementById('checkoutBtn'); btn.disabled=!cart.length;
            btn.className=cart.length?"w-full bg-emerald-500 text-white font-bold py-3.5 rounded-xl text-sm shadow active:scale-95 transition":"w-full bg-slate-400 text-white font-bold py-3.5 rounded-xl text-sm shadow cursor-not-allowed"; 
        }
        function clearCart() { cart=[]; updateCartUI(); }

        // ------------------ ส่งข้อมูลขึ้นคลัง ------------------
        function submitOrder() { 
            if(!cart.length) return; 
            const cust = document.getElementById('customerName').value.trim() || "ทั่วไป";
            const pay = document.getElementById('payment').value;
            
            if(pay === "ยังไม่ได้ชำระเงิน" && cust === "ทั่วไป") {
                alert("⚠️ หากเลือกสถานะยังไม่ได้ชำระเงิน กรุณากรอกชื่อลูกค้าตรงช่อง 'ชื่อผู้ซื้อ' เพื่อระบุตัวตนด้วยครับ");
                return;
            }

            fetch(WEB_APP_URL,{
                method:'POST',
                mode:'no-cors',
                body:JSON.stringify({
                    payment: pay,
                    customer: cust,
                    items: cart
                })
            }).then(() => { 
                alert("🎉 บันทึกข้อมูลการขายเสร็จสิ้น!"); 
                clearCart(); 
                document.getElementById('customerName').value = "ทั่วไป"; // รีเซ็ตชื่อลูกค้า
            }); 
        }

        // ------------------ ดูรายชื่อผู้ที่ยังไม่ชำระเงิน ------------------
        function openUnpaidModal() {
            const modal = document.getElementById('unpaidModal');
            const content = document.getElementById('unpaid-content');
            modal.classList.remove('hidden');
            content.innerHTML = `<p class="text-center text-slate-400 py-6">⏳ กำลังประมวลผลรายชื่อค้างชำระ...</p>`;

            fetch(`${WEB_APP_URL}?action=getHistory`)
            .then(r => r.json())
            .then(data => {
                // กรองเฉพาะรายการที่ระบุว่า "ยังไม่ได้ชำระเงิน"
                const unpaidBills = data.filter(item => item.payment === "ยังไม่ได้ชำระเงิน");

                if (unpaidBills.length === 0) {
                    content.innerHTML = `<p class="text-center text-emerald-600 font-bold py-6">🎉 ดีเยี่ยม! ไม่มีลูกค้าค้างชำระเงินในระบบ</p>`;
                    return;
                }

                // สรุปยอดค้างชำระรายคน (รวมยอดหากคนเดียวติดหลายบิล)
                const customerDebts = {};
                unpaidBills.forEach(item => {
                    if (!customerDebts[item.customer]) {
                        customerDebts[item.customer] = { totalDebt: 0, details: [] };
                    }
                    customerDebts[item.customer].totalDebt += item.total;
                    customerDebts[item.customer].details.push(item);
                });

                let html = "";
                for (const customer in customerDebts) {
                    html += `
                        <div class="bg-red-50 border border-red-200 rounded-xl p-3 space-y-1 shadow-sm">
                            <div class="flex justify-between items-center border-b border-red-100 pb-1.5">
                                <span class="font-bold text-red-800 text-sm">👤 คุณ ${customer}</span>
                                <span class="font-black text-red-600 text-sm bg-white border border-red-300 px-2 py-0.5 rounded">ยอดค้าง: ${customerDebts[customer].totalDebt.toFixed(2)} ฿</span>
                            </div>
                            <div class="pt-1 text-[11px] text-slate-500 space-y-1">
                    `;
                    customerDebts[customer].details.forEach(item => {
                        html += `<div>• ${item.date} (${item.time}) - ${item.name} ยอด ${item.total.toFixed(2)} ฿</div>`;
                    });
                    html += `</div></div>`;
                }
                content.innerHTML = html;
            }).catch(() => content.innerHTML = `<p class="text-center text-red-500 py-6">เกิดข้อผิดพลาดในการโหลดข้อมูล</p>`);
        }

        // ดูประวัติรวมรายวัน (ของเดิม)
        function openHistoryModal() {
            const modal = document.getElementById('historyModal'); const content = document.getElementById('history-content');
            modal.classList.remove('hidden'); content.innerHTML = `<p class="text-center text-slate-400 py-6">⏳ กำลังโหลดข้อมูล...</p>`;
            fetch(`${WEB_APP_URL}?action=getHistory`).then(r=>r.json()).then(data=>{
                if(!data.length){ content.innerHTML="<p class='text-center py-6'>ไม่มีข้อมูล</p>"; return; }
                const grouped = {}; data.forEach(i=>{ if(!grouped[i.date]){grouped[i.date]={items:[],total:0};} grouped[i.date].items.push(i); grouped[i.date].total+=i.total; });
                let h = ""; for(const d in grouped){
                    h += `<div class="bg-slate-50 border rounded-xl p-3"><div class="flex justify-between font-bold border-b pb-1"><span>📅 วันที่: ${d}</span><span class="text-blue-600">รวม: ${grouped[d].total.toFixed(2)} ฿</span></div><div class="divide-y divide-slate-100 max-h-32 overflow-y-auto">`;
                    grouped[d].items.forEach(i=>{ h+=`<div class="flex justify-between py-1 text-slate-700"><span>[${i.time}] ${i.name} (คุณ ${i.customer})</span><span class="font-bold font-mono">${i.total.toFixed(2)} ฿ <span class="text-[10px] font-normal ${i.payment==='ยังไม่ได้ชำระเงิน'?'text-red-500':'text-slate-400'}">(${i.payment})</span></span></div>`; });
                    h += `</div></div>`;
                } content.innerHTML = h;
            });
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
