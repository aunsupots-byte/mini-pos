<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบขายหน้าร้าน POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
    <style>
        :root{
            --paper:#FAF7EF; --card:#FFFFFF; --ink:#23241F; --ink-soft:#7B7666; --line:#E4DECB;
            --till:#0F7B5C; --till-deep:#0A5C44; --till-pale:#E3F2EA; --stamp:#BD3A2E;
            --stamp-pale:#FBEAE7; --amber:#D98A2B; --amber-pale:#FBF0DF; --blue:#2F5D8A;
            --blue-pale:#E9F0F6; --header:#1B1D17;
        }
        body{ font-family:'Sarabun','Plus Jakarta Sans',sans-serif; background:var(--paper); color:var(--ink); }
        .font-display{ font-family:'Plus Jakarta Sans','Sarabun',sans-serif; }
        .font-receipt{ font-family:'JetBrains Mono',ui-monospace,monospace; }
        #reader button, #reader img { display: none !important; }
        #reader { border: none !important; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; image-rendering: -webkit-optimize-contrast !important; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes scanline { 0%{ top:10%; } 50%{ top:90%; } 100%{ top:10%; } }
        .animate-slide-up { animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-scanline { animation: scanline 1.8s ease-in-out infinite; }
        .dotted-leader{ flex:1 1 auto; border-bottom:1.5px dotted var(--line); margin:0 6px; transform:translateY(-4px); }
        .ledger{ background:var(--header); border-radius:14px; }
        .ledger-digits{ font-family:'JetBrains Mono',ui-monospace,monospace; color:#5FE3A3; letter-spacing:0.5px; }
        .key-btn { transition: transform .12s ease, opacity .12s ease; }
        .key-btn:active { transform: scale(0.94); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen pb-28" onclick="unlockAudio()">

    <div class="px-4 py-3.5 sticky top-0 z-40" style="background:var(--header);">
        <div class="max-w-md mx-auto space-y-2.5">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                    <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:var(--till);">
                        <span class="text-white font-display font-extrabold text-sm">฿</span>
                    </div>
                    <div class="leading-tight">
                        <div class="font-display font-extrabold text-sm text-white tracking-tight">ระบบขายหน้าร้าน</div>
                        <div class="font-receipt text-[9px] text-white/40 tracking-wider">ULTRA SPEED POS</div>
                    </div>
                </div>
                <button onclick="preloadProductsData(true)" class="key-btn text-[9px] font-bold px-2.5 py-1 rounded-lg border text-emerald-400 border-emerald-500/30 bg-emerald-500/10">🔄 อัปเดตสต๊อก</button>
            </div>
            <div class="grid grid-cols-5 gap-1.5 text-[9px] font-bold leading-tight">
                <button onclick="openProductPickerModal()" class="key-btn text-white flex flex-col items-center justify-center gap-0.5 py-2 rounded-xl border border-white/10" style="background:var(--blue);"><span class="text-sm">🛍️</span>เลือกสินค้า</button>
                <button onclick="openAddProductModal()" class="key-btn text-white flex flex-col items-center justify-center gap-0.5 py-2 rounded-xl border border-white/10" style="background:var(--till);"><span class="text-sm">📦</span>คลัง</button>
                <button onclick="openStockModal()" class="key-btn text-white flex flex-col items-center justify-center gap-0.5 py-2 rounded-xl border border-white/10" style="background:var(--amber);"><span class="text-sm">🟢</span>สต๊อก</button>
                <button onclick="openUnpaidModal()" class="key-btn flex flex-col items-center justify-center gap-0.5 py-2 rounded-xl border" style="background-color:rgba(189,58,46,0.16); color:#FF8A7A; border-color:rgba(189,58,46,0.3);"><span class="text-sm">🚨</span>ค้างจ่าย</button>
                <button onclick="openHistoryModal()" class="key-btn flex flex-col items-center justify-center gap-0.5 py-2 rounded-xl border" style="background-color:rgba(255,255,255,0.08); color:#D9D4C2; border-color:rgba(255,255,255,0.14);"><span class="text-sm">📊</span>บัญชี</button>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-4">
        <div class="rounded-2xl shadow-sm border overflow-hidden" style="background:var(--card); border-color:var(--line);">
            <div class="flex justify-between items-center px-4 py-2.5" style="background:var(--header);">
                <div class="flex items-center space-x-1.5">
                    <span class="w-2 h-2 rounded-full animate-pulse" style="background:var(--amber);"></span>
                    <span class="text-[10px] font-bold text-white/70 uppercase tracking-wider font-receipt">BARCODE SCANNER</span>
                </div>
                <button id="cameraToggleBtn" onclick="toggleCamera()" class="key-btn text-white text-[10px] font-bold px-3.5 py-1 rounded-full" style="background:var(--till);">📷 เปิดกล้อง</button>
            </div>
            <div class="p-4 pt-2 space-y-2">
                <div class="relative w-full bg-black rounded-xl overflow-hidden h-36 border shadow-inner flex items-center justify-center" style="border-color:var(--line);">
                    <div id="reader" class="w-full h-full"></div>
                    <div id="laser-line" class="hidden absolute left-4 right-4 h-0.5 animate-scanline z-10" style="background:linear-gradient(to right, transparent, var(--amber), transparent); box-shadow:0 0 10px 1.5px var(--amber);"></div>
                </div>
                <div id="scan-status" class="text-center text-[11px] font-medium" style="color:var(--ink-soft);">💡 เล็งรหัสบาร์โค้ดหรือคิวอาร์โค้ดให้อยู่ในกรอบกล้องสแกน</div>
            </div>
        </div>

        <div class="rounded-2xl shadow-sm border p-5 space-y-4" style="background:var(--card); border-color:var(--line);">
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider mb-1.5" style="color:var(--ink-soft);">👤 ข้อมูลลูกค้า / ผู้ซื้อ</label>
                <input type="text" id="customerName" value="ทั่วไป" class="w-full p-3.5 rounded-xl font-bold text-sm focus:outline-none transition-all" style="background:var(--paper); border:1px solid var(--line); color:var(--ink);">
            </div>
            <div class="border-t" style="border-color:var(--line);"></div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider mb-1.5" style="color:var(--ink-soft);">รหัสบาร์โค้ด</label>
                    <input type="text" id="barcode" class="w-full p-3.5 rounded-xl font-receipt font-bold text-sm" style="background:var(--paper); border:1px solid var(--line); color:var(--ink);" placeholder="บาร์โค้ดสินค้า" onchange="fetchProductData(this.value)">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider mb-1.5" style="color:var(--ink-soft);">ราคาต่อชิ้น (฿)</label>
                    <input type="number" id="price" class="w-full p-3.5 rounded-xl text-right font-receipt font-bold text-sm" style="background:var(--paper); border:1px solid var(--line); color:var(--till-deep);" placeholder="0.00">
                </div>
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider mb-1.5" style="color:var(--ink-soft);">ชื่อรายการสินค้า</label>
                <input type="text" id="productName" class="w-full p-3.5 rounded-xl font-bold text-sm" style="background:var(--paper); border:1px solid var(--line); color:var(--ink);" placeholder="ระบุชื่อสินค้าเด่นชัด">
            </div>
            <div class="flex space-x-2.5 pt-1">
                <div class="w-1/3">
                    <input type="number" id="quantity" value="1" min="1" class="w-full p-3.5 rounded-xl text-center font-receipt font-bold text-sm" style="background:var(--paper); border:1px solid var(--line); color:var(--ink);">
                </div>
                <button type="button" onclick="addToCart()" class="key-btn w-2/3 text-white font-bold rounded-xl shadow-sm text-sm" style="background:var(--till);">➕ เพิ่มสินค้าลงบิล</button>
            </div>
        </div>

        <div class="rounded-2xl shadow-sm border p-5 space-y-4" style="background:var(--card); border-color:var(--line);">
            <div class="flex justify-between items-center border-b pb-2.5" style="border-color:var(--line);">
                <h3 class="text-[11px] font-bold uppercase tracking-wider" style="color:var(--ink-soft);">🧾 รายการในบิลปัจจุบัน</h3>
                <button onclick="clearCart()" class="text-xs font-bold hover:underline" style="color:var(--stamp);">ล้างทั้งหมด</button>
            </div>
            <div id="cart-list" class="space-y-1.5 max-h-48 overflow-y-auto pr-1 text-sm"><p class="text-center py-6 text-xs font-medium" style="color:var(--ink-soft);">ยังไม่มีสินค้าในบิลนี้</p></div>
            <div class="ledger flex justify-between items-center px-4 py-3.5 mt-2">
                <span class="text-[11px] font-bold uppercase tracking-wider text-white/50 font-receipt">ยอดรวมสุทธิ</span>
                <span id="grand-total" class="ledger-digits text-2xl font-bold tracking-tight">0.00 ฿</span>
            </div>
        </div>

        <div class="rounded-2xl shadow-sm border p-4 space-y-3" style="background:var(--card); border-color:var(--line);">
            <select id="payment" class="w-full p-3.5 rounded-xl font-bold text-xs focus:outline-none" style="background:var(--paper); border:1px solid var(--line); color:var(--ink);">
                <option value="โอนเงิน">💸 โอนเงินผ่านธนาคาร</option>
                <option value="เงินสด">💵 เงินสด</option>
                <option value="ยังไม่ได้ชำระเงิน">🚨 ยังไม่ได้ชำระเงิน (ติดหนี้ไว้ก่อน)</option>
            </select>
            <button type="button" id="checkoutBtn" onclick="submitOrder()" disabled class="w-full font-bold py-4 rounded-xl text-base shadow-inner cursor-not-allowed transition-all duration-200" style="background:var(--line); color:#A8A28C;">🚀 ยืนยันปิดบิลและส่งข้อมูล</button>
        </div>
    </div>

    <div id="reportModal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center transition-all duration-300 p-0 sm:p-4" style="background:rgba(20,18,12,0.55); backdrop-filter:blur(6px);">
        <div class="w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[88vh] flex flex-col shadow-2xl border animate-slide-up" style="background:var(--card); border-color:var(--line);">
            <div class="p-4 border-b flex justify-between items-center rounded-t-3xl" style="border-color:var(--line); background:var(--paper);">
                <h2 id="modalTitle" class="font-display font-extrabold text-sm tracking-tight" style="color:var(--ink);">รายงาน</h2>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full font-bold flex items-center justify-center text-sm" style="background:var(--line); color:var(--ink-soft);">✕</button>
            </div>
            <div id="modalContent" class="p-4 overflow-y-auto flex-1 space-y-4 text-xs"></div>
        </div>
    </div>

    <div id="successToast" class="hidden fixed bottom-6 left-1/2 transform -translate-x-1/2 px-5 py-4 rounded-2xl flex items-center space-x-3 z-50 shadow-2xl max-w-[90%] w-[340px] border animate-slide-up" style="background:rgba(27,29,23,0.97); border-color:rgba(255,255,255,0.1);">
        <div id="toastIcon" class="w-9 h-9 rounded-xl flex items-center justify-center text-base font-bold text-white" style="background:var(--till);">✓</div>
        <div class="flex-1 min-w-0">
            <div class="font-bold text-xs text-white tracking-wide" id="toastTitle">ระบบแจ้งเตือน</div>
            <div class="text-[11px] text-white/50 truncate mt-0.5" id="toastMessage">ทำรายการสำเร็จ</div>
        </div>
    </div>

    <script>
        // ⚠️ วาง URL ของ Google Apps Script ของคุณที่นี่ (ลงท้ายด้วย /exec)
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx92ov484ob-O4ncwwjpzhD2E5wgwmuhAguCRD8gBiVpyhCiyqLru0LTCqlnHjwHhtFvg/exec";

        let cart = []; let html5Qrcode = null; let isCameraOpen = false; let audioCtx = null; let isProcessing = false;
        let catalogProducts = []; let catalogFiltered = [];

        function unlockAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        function playBeepSound() { 
            try { 
                unlockAudio(); if (!audioCtx) return; 
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); 
                osc.connect(gain); gain.connect(audioCtx.destination); osc.type = 'sine'; 
                osc.frequency.setValueAtTime(1000, audioCtx.currentTime); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08); osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.08); 
            } catch(e) { console.log(e); } 
        }

        function showSuccessToast(message, isError = false) {
            const toast = document.getElementById('successToast'); const icon = document.getElementById('toastIcon'); const title = document.getElementById('toastTitle'); const msgText = document.getElementById('toastMessage');
            msgText.innerText = message;
            if(isError) { title.innerText = "เกิดข้อผิดพลาด"; icon.innerText = "❌"; icon.style.background = "var(--stamp)"; } 
            else { title.innerText = "สำเร็จเสร็จสิ้น"; icon.innerText = "✓"; icon.style.background = "var(--till)"; }
            toast.classList.remove('hidden'); setTimeout(() => { toast.classList.add('hidden'); }, 2500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const localCachedData = localStorage.getItem('pos_products_cache');
            if (localCachedData) {
                catalogProducts = JSON.parse(localCachedData);
                catalogFiltered = catalogProducts;
            }
            preloadProductsData(false);
        });

        function preloadProductsData(forceNotify = false) {
            if (forceNotify) showSuccessToast("⏳ กำลังอัปเดตสต๊อกสินค้าล่าสุด...");
            fetch(`${WEB_APP_URL}?action=getProductsData&_t=${Date.now()}`)
            .then(r => r.json())
            .then(products => {
                if (products && Array.isArray(products)) {
                    catalogProducts = products;
                    catalogFiltered = products;
                    localStorage.setItem('pos_products_cache', JSON.stringify(products));
                    if (forceNotify) showSuccessToast("🟢 อัปเดตข้อมูลคลังสินค้าสำเร็จแล้ว");
                    if (document.getElementById('catalogList')) renderCatalogList();
                }
            }).catch(err => {
                if (forceNotify) showSuccessToast("🟢 ดึงแคชสินค้าหน้าร้านเรียบร้อย");
            });
        }

        const SCAN_CONFIG = {
            fps: 22,
            qrbox: function(width, height) { return { width: Math.min(width * 0.85, 260), height: Math.min(height * 0.6, 110) }; },
            formatsToSupport: [ Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.QR_CODE ]
        };

        function onCameraStarted() {
            isCameraOpen = true;
            document.getElementById('laser-line').classList.remove('hidden');
            document.getElementById('cameraToggleBtn').innerText = "🔴 ปิดกล้อง";
            document.getElementById('cameraToggleBtn').style.background = "var(--stamp)";
            document.getElementById('scan-status').innerText = "🎯 เล็งบาร์โค้ด / QR Code ให้อยู่ในกรอบ";
        }

        async function startCamera() {
            document.getElementById('scan-status').innerText = "⏳ กำลังเชื่อมต่อระบบกล้อง...";
            isProcessing = false;
            if (html5Qrcode) { try { await html5Qrcode.stop(); } catch(e) {} try { html5Qrcode.clear(); } catch(e) {} }
            html5Qrcode = new Html5Qrcode("reader", false);
            let attempts = [ { facingMode: { exact: "environment" } }, { facingMode: { ideal: "environment" } }, { facingMode: "user" }, true ];
            for (const constraint of attempts) {
                try {
                    await html5Qrcode.start(constraint, SCAN_CONFIG, onScanSuccess, () => {});
                    onCameraStarted();
                    return;
                } catch(err) { continue; }
            }
            document.getElementById('scan-status').innerHTML = "❌ ไม่พบสัญญาณกล้อง สามารถกรอกบาร์โค้ดเองได้ครับ";
        }

        async function stopCamera() {
            if (html5Qrcode && isCameraOpen) {
                try { await html5Qrcode.stop(); } catch(e) {}
                isCameraOpen = false;
                document.getElementById('laser-line').classList.add('hidden');
                document.getElementById('reader').innerHTML = "";
                document.getElementById('cameraToggleBtn').innerText = "📷 เปิดกล้อง";
                document.getElementById('cameraToggleBtn').style.background = "var(--till)";
                document.getElementById('scan-status').innerText = "💡 พร้อมใช้งานกล้องใหม่อีกครั้ง";
            }
        }
        function toggleCamera() { isCameraOpen ? stopCamera() : startCamera(); }
        function onScanSuccess(decodedText) { if (isProcessing) return; isProcessing = true; playBeepSound(); if (navigator.vibrate) navigator.vibrate([80, 40, 80]); document.getElementById('barcode').value = decodedText; fetchProductData(decodedText); setTimeout(() => { stopCamera(); showSuccessToast("จับรหัสสินค้าสำเร็จ!"); }, 300); }

        function fetchProductData(bc) { 
            if(!bc) return; 
            document.getElementById('productName').value = "⏳ ค้นข้อมูลในแรมหน่วยความจำ..."; 
            const matchedProduct = catalogProducts.find(p => String(p.barcode).trim() === String(bc).trim());
            if (matchedProduct) {
                document.getElementById('productName').value = matchedProduct.name;
                document.getElementById('price').value = matchedProduct.price;
                showSuccessToast(`พบข้อมูล: ${matchedProduct.name}`);
            } else {
                fetch(`${WEB_APP_URL}?barcode=${bc}&_t=${Date.now()}`).then(r=>r.json()).then(d=>{ 
                    if(d.found){ 
                        document.getElementById('productName').value = d.name; document.getElementById('price').value = d.price; 
                    } else { 
                        document.getElementById('productName').value = "คลังไม่มีรหัสนี้ (สามารถพิมพ์ตั้งชื่อเองได้)"; 
                    } 
                });
            }
        }

        function addToCart() { const b = document.getElementById('barcode').value, n = document.getElementById('productName').value, p = parseFloat(document.getElementById('price').value), q = parseInt(document.getElementById('quantity').value); if(!b || !n || isNaN(p) || q <= 0) { showSuccessToast("กรอกข้อมูลฟอร์มไม่ครบ!", true); return; } cart.push({barcode:b, name:n, price:p, quantity:q}); updateCartUI(); document.getElementById('barcode').value=""; document.getElementById('productName').value=""; document.getElementById('price').value=""; showSuccessToast("เพิ่มเข้าตะกร้าบิลแล้ว"); }
        
        function updateCartUI() {
            const list = document.getElementById('cart-list'); let html = "", total = 0;
            cart.forEach((item) => {
                total += (item.price * item.quantity);
                html += `<div class="py-2 border-b" style="border-color:var(--line);">
                    <div class="flex items-baseline">
                        <span class="font-bold text-sm truncate" style="color:var(--ink); max-width:60%;">${item.name}</span>
                        <span class="dotted-leader"></span>
                        <span class="font-receipt font-bold text-sm" style="color:var(--ink);">${(item.price * item.quantity).toFixed(2)} ฿</span>
                    </div>
                    <div class="text-[10px] font-receipt mt-0.5" style="color:var(--ink-soft);">${item.barcode} · ${item.price} ฿ × ${item.quantity}</div>
                </div>`;
            });
            list.innerHTML = cart.length ? html : `<p class="text-center py-6 text-xs font-medium" style="color:var(--ink-soft);">ยังไม่มีสินค้าในบิลนี้</p>`;
            document.getElementById('grand-total').innerText = total.toFixed(2) + " ฿";
            const btn = document.getElementById('checkoutBtn');
            btn.disabled = !cart.length; btn.style.background = cart.length ? "var(--till)" : "var(--line)"; btn.style.color = cart.length ? "#FFFFFF" : "#A8A28C"; btn.style.cursor = cart.length ? "pointer" : "not-allowed";
        }
        function clearCart() { cart = []; updateCartUI(); }
        function submitOrder() { if(!cart.length) return; const cust = document.getElementById('customerName').value.trim(); const pay = document.getElementById('payment').value; if(pay === "ยังไม่ได้ชำระเงิน" && cust === "ทั่วไป") { showSuccessToast("กรุณาระบุชื่อคนติดหนี้ค้างจ่าย!", true); return; } document.getElementById('checkoutBtn').disabled = true; document.getElementById('checkoutBtn').innerText = "⏳ ระบบกำลังส่งข้อมูลเข้า Sheets..."; fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ payment: pay, customer: cust, items: cart }) }).then(() => { showSuccessToast("🎉 บันทึกปิดบิลเข้าคลังสำเร็จ!"); clearCart(); document.getElementById('customerName').value = "ทั่วไป"; preloadProductsData(false); }).finally(() => { document.getElementById('checkoutBtn').innerText = "🚀 ยืนยันปิดบิลและส่งข้อมูล"; updateCartUI(); }); }

        function openAddProductModal() {
            let html = `<div class="space-y-4 p-1">
                <p class="text-xs font-bold uppercase tracking-wide" style="color:var(--ink-soft);">📦 แบบฟอร์มเพิ่มสินค้าใหม่เข้าฐานข้อมูล</p>
                <div class="space-y-3">
                    <div><label class="block text-[11px] font-bold mb-1" style="color:var(--ink-soft);">เลขบาร์โค้ด / รหัสสินค้า</label><input type="text" id="newPBarcode" class="w-full p-3.5 rounded-xl font-receipt font-bold text-sm" style="background:var(--paper); border:1px solid var(--line); color:var(--ink);" placeholder="พิมพ์รหัสสินค้า"></div>
                    <div><label class="block text-[11px] font-bold mb-1" style="color:var(--ink-soft);">ชื่อรายการสินค้า</label><input type="text" id="newPName" class="w-full p-3.5 rounded-xl text-sm font-bold" style="background:var(--paper); border:1px solid var(--line); color:var(--ink);" placeholder="เช่น นมจืดตราหมี 200ml"></div>
                    <div><label class="block text-[11px] font-bold mb-1" style="color:var(--ink-soft);">ราคาตั้งขายต่อชิ้น (บาท)</label><input type="number" id="newPPrice" class="w-full p-3.5 rounded-xl font-receipt font-bold text-sm" style="background:var(--paper); border:1px solid var(--line); color:var(--till-deep);" placeholder="0.00"></div>
                </div>
                <button onclick="submitNewProduct()" id="saveProductBtn" class="key-btn w-full text-white font-bold py-3.5 rounded-xl shadow-sm text-sm" style="background:var(--till);">💾 บันทึกสินค้าลงคลังแผ่นงาน</button>
            </div>`;
            showModal("📦 เพิ่มรายการสินค้าใหม่", html);
        }

        function submitNewProduct() {
            const barcode = document.getElementById('newPBarcode').value.trim(), name = document.getElementById('newPName').value.trim(), price = document.getElementById('newPPrice').value.trim();
            if(!barcode || !name || !price || isNaN(price)) { alert("🚨 กรุณากรอกข้อมูลสินค้าให้ครบถ้วน!"); return; }
            document.getElementById('saveProductBtn').disabled = true; document.getElementById('saveProductBtn').innerText = "⏳ กำลังส่งข้อมูล..."; showSuccessToast("⏳ กำลังเพิ่มสินค้าเข้าคลัง...");
            const productData = new URLSearchParams(); productData.append('action', 'addNewProduct'); productData.append('barcode', barcode); productData.append('name', name); productData.append('price', price);
            fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: productData.toString(), mode: 'no-cors' }).then(() => { showSuccessToast("🎉 เพิ่มสินค้าลงคลังเรียบร้อย!"); closeModal(); preloadProductsData(false); }).finally(() => { document.getElementById('saveProductBtn').disabled = false; document.getElementById('saveProductBtn').innerText = "💾 บันทึกสินค้าลงคลังแผ่นงาน"; });
        }

        // 🔥 ซ่อมแซมระบบประวัติยอดขาย: เพิ่มระบบดักจับ (Catch) หากเชื่อมต่อไม่ได้หรือสูตรวันเวลาผิดพลาด ให้แจกแจงแจ้งเตือนชัดเจน
        function openHistoryModal() {
            showModal("📊 รายงานสรุปยอดขายรายวัน", `<p class="text-center py-4 font-medium animate-pulse" style="color:var(--ink-soft);">⏳ กำลังเชื่อมต่อแผ่นงานหลังบ้าน...</p>`);
            
            fetch(`${WEB_APP_URL}?action=getHistory&_t=${Date.now()}`)
            .then(r => r.json())
            .then(data => {
                if(!data || data.length === 0) {
                    document.getElementById('modalContent').innerHTML = `<p class="text-center py-6 font-bold text-amber-600">❌ ไม่พบประวัติการขายใดๆ ในแผ่นงานหลังบ้าน</p>`;
                    return;
                }
                
                const dailyTotals = {}; const dailyItems = {};
                data.forEach(i => { 
                    if(!dailyTotals[i.date]) { dailyTotals[i.date] = 0; dailyItems[i.date] = []; } 
                    dailyTotals[i.date] += i.total; dailyItems[i.date].push(i); 
                });
                
                let html = '<div class="space-y-3 max-h-[72vh] overflow-y-auto pr-1">'; let dayIndex = 0;
                for(const date in dailyTotals) {
                    dayIndex++;
                    html += `
                        <div class="rounded-2xl shadow-sm overflow-hidden border" style="border-color:var(--line);">
                            <div onclick="toggleDayDetails(${dayIndex})" class="p-4 flex justify-between items-center cursor-pointer select-none" style="background:var(--paper);">
                                <div class="flex items-center space-x-2.5">
                                    <span id="arrow-icon-${dayIndex}" class="text-[10px] transition-transform duration-200" style="color:var(--ink-soft);">▶</span>
                                    <span class="font-extrabold text-xs sm:text-sm" style="color:var(--ink);">📅 ${date}</span>
                                </div>
                                <div class="text-right">
                                    <span class="text-[9px] block font-bold" style="color:var(--ink-soft);">รวมวันนี้</span>
                                    <span class="font-receipt font-bold text-sm sm:text-base" style="color:var(--till-deep);">${dailyTotals[date].toFixed(2)} ฿</span>
                                </div>
                            </div>
                            <div id="details-box-${dayIndex}" class="hidden p-3 divide-y" style="background:var(--card); border-color:var(--line);">
                    `;
                    dailyItems[date].forEach(item => {
                        html += `
                            <div class="flex justify-between py-2.5 text-xs items-center" style="border-color:var(--line);">
                                <div class="space-y-0.5 truncate" style="max-width:70%;">
                                    <div class="font-bold truncate" style="color:var(--ink);">${item.name}</div>
                                    <div class="text-[10px] font-medium" style="color:var(--ink-soft);">🕒 ${item.time} - ผู้ซื้อ: ${item.customer}</div>
                                </div>
                                <div class="text-right">
                                    <div class="font-receipt font-bold" style="color:var(--ink);">${item.total.toFixed(2)} ฿</div>
                                    <div class="text-[9px] font-bold" style="color:${item.payment === 'ยังไม่ได้ชำระเงิน' ? 'var(--stamp)' : 'var(--till-deep)'};">(${item.payment})</div>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div></div>`;
                }
                html += '</div>'; 
                document.getElementById('modalContent').innerHTML = dayIndex > 0 ? html : `<p class="text-center py-6" style="color:var(--ink-soft);">ไม่มีข้อมูลประวัติยอดขาย</p>`;
            }).catch(err => {
                document.getElementById('modalContent').innerHTML = `<p class="text-center py-6 font-bold text-red-600">❌ ดึงรายงานขัดข้อง กรุณาตรวจสอบชื่อหน้าชีท Sales หลังบ้าน</p>`;
            });
        }
        
        function toggleDayDetails(index) {
            const box = document.getElementById(`details-box-${index}`), arrow = document.getElementById(`arrow-icon-${index}`);
            if (box.classList.contains('hidden')) { box.classList.remove('hidden'); arrow.style.transform = 'rotate(90deg)'; }
            else { box.classList.add('hidden'); arrow.style.transform = 'rotate(0deg)'; }
        }

        function openStockModal() {
            let stockHtml = '<div class="space-y-2.5 max-h-[72vh] overflow-y-auto pr-1">';
            if(catalogProducts && catalogProducts.length > 0) {
                catalogProducts.forEach(p => {
                    const isOut = p.stock <= 0;
                    stockHtml += `
                        <div class="p-4 rounded-2xl shadow-sm flex justify-between items-center border" style="background:${isOut ? 'var(--stamp-pale)' : 'var(--card)'}; border-color:${isOut ? 'rgba(189,58,46,0.25)' : 'var(--line)'};">
                            <div class="truncate" style="max-width:65%;">
                                <div class="font-bold text-xs sm:text-sm truncate" style="color:${isOut ? 'var(--stamp)' : 'var(--ink)'};">${p.name}</div>
                                <div class="text-[10px] font-receipt mt-0.5" style="color:var(--ink-soft);">${p.barcode} · ${p.price.toFixed(2)} ฿</div>
                            </div>
                            <div class="text-right">
                                <span class="text-[9px] block font-bold" style="color:var(--ink-soft);">สต๊อกจริง</span>
                                <span class="font-receipt font-bold text-sm ${isOut ? 'animate-pulse' : ''}" style="color:${isOut ? 'var(--stamp)' : 'var(--till-deep)'}; ${isOut ? 'background:rgba(189,58,46,0.12); padding:2px 8px; border-radius:6px;' : ''}">
                                    ${p.stock} ชิ้น
                                </span>
                            </div>
                        </div>
                    `;
                });
                stockHtml += '</div>'; showModal("📦 รายการสินค้าคงเหลือในคลัง", stockHtml);
            } else {
                showModal("📦 รายการสินค้าคงเหลือในคลัง", `<p class="text-center py-6" style="color:var(--ink-soft);">คลังข้อมูลว่างเปล่า กรุณากดปุ่ม "อัปเดตสต๊อก" ขวาสดด้านบน</p>`);
            }
        }

        function generateAutoFallbackImage(productName) {
            const clean = String(productName).toLowerCase();
            let key = "box"; 
            if (clean.includes("นม") || clean.includes("milk")) key = "milk-carton";
            else if (clean.includes("น้ำ") || clean.includes("water")) key = "water-bottle";
            else if (clean.includes("ชา") || clean.includes("tea") || clean.includes("โออิชิ")) key = "iced-tea";
            else if (clean.includes("ขนม") || clean.includes("เลย์") || clean.includes("snack")) key = "chips";
            else if (clean.includes("กาแฟ") || clean.includes("coffee")) key = "coffee-can";
            return `https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=150&q=80&sig=${encodeURIComponent(key)}`;
        }

        function openProductPickerModal() { catalogFiltered = catalogProducts; renderCatalogModal(); }
        function renderCatalogModal() {
            const wrap = `
                <div class="space-y-3">
                    <input type="text" id="catalogSearch" oninput="filterCatalog(this.value)" placeholder="🔎 ค้นหาชื่อสินค้าหรือบาร์โค้ด..." class="w-full p-3 rounded-xl text-sm font-bold" style="background:var(--paper); border:1px solid var(--line); color:var(--ink);">
                    <p class="text-[10px] font-medium" style="color:var(--ink-soft);">แตะเลือกการ์ดสินค้าเพื่อเพิ่มยอดลงในบิลขายหน้าร้านได้ทันที</p>
                    <div id="catalogList" class="grid grid-cols-2 gap-2.5 max-h-[58vh] overflow-y-auto pr-1 no-scrollbar"></div>
                </div>
            `;
            document.getElementById('reportModal').classList.remove('hidden');
            document.getElementById('modalTitle').innerText = "🛍️ เลือกสินค้าจากคลัง";
            document.getElementById('modalContent').innerHTML = wrap;
            renderCatalogList();
        }

        function renderCatalogList() {
            const listEl = document.getElementById('catalogList'); if (!listEl) return;
            if (!catalogFiltered.length) { listEl.innerHTML = `<p class="col-span-2 text-center py-6 text-xs" style="color:var(--ink-soft);">ไม่พบสินค้าในฐานความจำ</p>`; return; }
            let html = "";
            catalogFiltered.forEach((p) => {
                const isOut = p.stock <= 0;
                let sheetImgUrl = p.image || p.Image || "";
                const finalImgUrl = (sheetImgUrl && sheetImgUrl.trim() !== "") ? sheetImgUrl.trim() : generateAutoFallbackImage(p.name);
                html += `
                    <div onclick="${isOut ? '' : `selectProductFromCatalog('${p.barcode}', '${p.name.replace(/'/g, "\\'")}', ${p.price}, ${p.stock})`}" 
                         class="key-btn p-2.5 rounded-2xl shadow-sm flex flex-col justify-between border cursor-pointer active:opacity-70 bg-white" 
                         style="border-color:${isOut ? 'rgba(189,58,46,0.25)' : 'var(--line)'}; opacity:${isOut ? '0.5' : '1'};">
                        <div class="w-full h-24 rounded-xl overflow-hidden mb-2 bg-slate-50 relative border border-slate-100">
                            <img src="${finalImgUrl}" alt="${p.name}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src=generateAutoFallbackImage('${p.name.replace(/'/g, "\\'")}');">
                            <div class="absolute top-1 right-1 text-[8px] bg-black/60 text-white px-1.5 py-0.5 rounded font-receipt">คลัง: ${p.stock}</div>
                        </div>
                        <div class="space-y-0.5 min-w-0">
                            <div class="font-bold text-[11px] truncate" style="color:var(--ink);">${p.name}</div>
                            <div class="text-[9px] font-receipt truncate" style="color:var(--ink-soft);">${p.barcode}</div>
                        </div>
                        <div class="flex justify-between items-center mt-1.5 pt-1 border-t border-dashed" style="border-color:var(--line);">
                            <span class="font-receipt font-bold text-xs" style="color:var(--blue);">${p.price.toFixed(2)} ฿</span>
                            <span class="text-[9px] font-bold text-emerald-700">${isOut ? 'หมด' : 'เลือก ➕'}</span>
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        function filterCatalog(query) {
            const q = query.trim().toLowerCase();
            catalogFiltered = !q ? catalogProducts : catalogProducts.filter(p => (p.name || "").toLowerCase().includes(q) || String(p.barcode || "").toLowerCase().includes(q));
            renderCatalogList();
        }

        function selectProductFromCatalog(barcode, name, price, stock) {
            playBeepSound(); if (navigator.vibrate) navigator.vibrate(35);
            const exist = cart.find(item => item.barcode === barcode);
            if(exist && exist.quantity >= stock) { showSuccessToast("🚨 สินค้าในคลังสต๊อกมีไม่พอขาย", true); return; }
            if(exist) { exist.quantity += 1; } else { cart.push({ barcode: barcode, name: name, price: parseFloat(price), quantity: 1 }); }
            updateCartUI(); showSuccessToast(`เพิ่ม "${name}" เข้าบิล`);
        }

        // 🔥 ซ่อมแซมระบบดึงรายชื่อคนติดหนี้ค้างจ่ายเงิน: ดักจับข้อผิดพลาดป้องกันโมดอลค้างขาวโพลน
        function openUnpaidModal() {
            showModal("🚨 รายชื่อลูกค้าค้างจ่ายเงิน", `<p class="text-center py-4 font-medium animate-pulse" style="color:var(--ink-soft);">⏳ กำลังรวบรวมบิลคงค้าง...</p>`); 
            
            fetch(`${WEB_APP_URL}?action=getHistory&_t=${Date.now()}`)
            .then(r => r.json())
            .then(data => {
                const unpaid = data.filter(i => i.payment === "ยังไม่ได้ชำระเงิน" || i.payment === "ค้างจ่าย");
                if(!unpaid || unpaid.length === 0) {
                    document.getElementById('modalContent').innerHTML = `<p class="text-center py-6 font-bold text-emerald-600">🎉 ยอดเยี่ยม! ไม่พบยอดหนี้ค้างชำระเงินหน้าร้านในขณะนี้</p>`;
                    return;
                }
                
                const debts = {}; 
                unpaid.forEach(i => { 
                    if(!debts[i.customer]) debts[i.customer] = {total:0, list:[]}; 
                    debts[i.customer].total += i.total; debts[i.customer].list.push(i); 
                });
                
                let html = ""; let customerIndex = 0;
                for(const c in debts) {
                    customerIndex++;
                    html += `
                        <div id="debt-box-${customerIndex}" class="p-4 rounded-2xl mb-3 transition-all duration-300 border" style="background:var(--stamp-pale); border-color:rgba(189,58,46,0.2);">
                            <div class="flex justify-between items-center border-b pb-2 text-xs font-bold" style="border-color:rgba(189,58,46,0.18); color:var(--stamp);">
                                <div class="flex flex-col">
                                    <span class="font-bold text-sm" style="color:var(--ink);">👤 คุณ ${c}</span>
                                    <span class="text-[10px] font-receipt font-bold mt-0.5" style="color:var(--stamp);">ยอดรวมค้าง: ${debts[c].total.toFixed(2)} ฿</span>
                                </div>
                                <button onclick="clearAllCustomerDebt('${c}', ${customerIndex})" class="key-btn text-white text-[11px] font-bold px-3 py-1.5 rounded-xl shadow-sm" style="background:var(--till);">💸 จ่ายเงินครบแล้ว</button>
                            </div>
                            <div class="text-[10px] pt-2.5 space-y-2 max-h-[40vh] overflow-y-auto" style="color:var(--ink-soft);">
                    `;
                    debts[c].list.forEach(i => { 
                        html += `<div class="flex justify-between items-center p-2.5 rounded-xl border font-medium" style="background:var(--card); border-color:var(--line);"><span style="color:var(--ink);">• ${i.name} (x${i.quantity})</span><span class="font-receipt font-bold" style="color:var(--ink);">${i.total.toFixed(2)} ฿</span></div>`; 
                    });
                    html += `</div></div>`;
                }
                document.getElementById('modalContent').innerHTML = html;
            }).catch(err => {
                document.getElementById('modalContent').innerHTML = `<p class="text-center py-6 font-bold text-red-600">❌ ไม่สามารถดึงรายชื่อผู้ค้างชำระได้ เนื่องจากโครงสร้างไฟล์ Sales หลังบ้านไม่สมบูรณ์</p>`;
            });
        }

        function clearAllCustomerDebt(customerName, boxIndex) {
            const targetBox = document.getElementById(`debt-box-${boxIndex}`);
            if (targetBox) { targetBox.style.opacity = '0'; targetBox.style.transform = 'scale(0.95)'; setTimeout(() => { targetBox.remove(); if(document.querySelectorAll('[id^="debt-box-"]').length === 0) { document.getElementById('modalContent').innerHTML = `<p class="text-center py-6" style="color:var(--ink-soft);">🎉 ไม่พบยอดค้างชำระเงิน</p>`; } }, 300); }
            showSuccessToast(`💸 เคลียร์หนี้ คุณ ${customerName} สำเร็จ!`);
            const formDetails = new URLSearchParams(); formDetails.append('action', 'clearCustomerDebt'); formDetails.append('customerName', customerName);
            fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: formDetails.toString(), mode: 'no-cors' }).then(() => { setTimeout(() => { preloadProductsData(false); }, 1000); });
        }

        function showModal(title, text) { document.getElementById('reportModal').classList.remove('hidden'); document.getElementById('modalTitle').innerText = title; document.getElementById('modalContent').innerHTML = text; }
        function closeModal() { document.getElementById('reportModal').classList.add('hidden'); }
    </script>
</body>
</html>
