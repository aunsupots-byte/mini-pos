<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ Premium POS Mobile - UI/UX Pro 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
    <style>
        body { font-family: 'Sarabun', 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        #reader button, #reader img { display: none !important; }
        #reader { border: none !important; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; image-rendering: -webkit-optimize-contrast !important; }
        
        /* Custom Smooth Animation สำหรับกล่อง Pop-up และ Toast */
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-slide-up { animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen pb-28 text-slate-900 selection:bg-indigo-500/20" onclick="unlockAudio()">

    <div class="bg-slate-900/90 text-white px-4 py-3.5 shadow-md sticky top-0 z-40 backdrop-blur-lg border-b border-white/5">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-gradient-to-tr from-indigo-500 to-fuchsia-500 rounded-xl flex items-center justify-center shadow-md shadow-indigo-500/30">
                    <span class="text-white font-bold text-sm">⚡</span>
                </div>
                <span class="font-extrabold text-sm tracking-tight bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">PREMIUM POS</span>
            </div>
            <div class="flex space-x-1.5 text-[10px] font-bold">
                <button onclick="openAddProductModal()" class="bg-fuchsia-600 hover:bg-fuchsia-500 text-white px-2.5 py-1.5 rounded-xl shadow-sm transition active:scale-95 border border-fuchsia-400/20">📦 คลัง</button>
                <button onclick="openUnpaidModal()" class="bg-rose-500/15 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 px-2.5 py-1.5 rounded-xl transition active:scale-95">🚨 ค้างจ่าย</button>
                <button onclick="openHistoryModal()" class="bg-indigo-500/15 hover:bg-indigo-500/20 text-indigo-400 border border-indigo-500/20 px-2.5 py-1.5 rounded-xl transition active:scale-95">📊 บัญชี</button>
                <button onclick="openStockModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1.5 rounded-xl shadow-sm transition active:scale-95 border border-emerald-400/20">🟢 สต๊อก</button>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-4">
        
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/60 transition-all">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center space-x-1.5">
                    <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">ระบบตรวจจับรหัสสินค้า</span>
                </div>
                <button id="cameraToggleBtn" onclick="toggleCamera()" class="bg-slate-900 text-white text-[11px] font-bold px-4 py-1.5 rounded-full shadow-sm transition-all duration-200 hover:bg-slate-800">📷 เปิดใช้งานกล้อง</button>
            </div>
            <div class="relative w-full bg-slate-950 rounded-2xl overflow-hidden aspect-[4/3] border border-slate-200 shadow-inner flex items-center justify-center">
                <div id="reader" class="w-full h-full"></div>
                <div id="laser-line" class="hidden absolute left-4 right-4 h-0.5 bg-gradient-to-r from-transparent via-fuchsia-500 to-transparent shadow-[0_0_12px_rgba(217,70,239,1)] animate-pulse z-10"></div>
            </div>
            <div id="scan-status" class="text-center text-xs font-medium text-slate-400 mt-3">💡 กดปุ่มเพื่อเปิดกล้องหลังและเริ่มยิงบาร์โค้ด</div>
        </div>

        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200/60 space-y-4">
            <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">👤 ข้อมูลลูกค้า / ผู้ซื้อ</label>
                <input type="text" id="customerName" value="ทั่วไป" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 focus:outline-none focus:border-indigo-500 focus:bg-white transition-all text-sm">
            </div>
            <div class="border-t border-slate-100 my-2"></div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">รหัสบาร์โค้ด</label>
                    <input type="text" id="barcode" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-mono font-bold text-slate-800 text-sm" placeholder="สแกนอัตโนมัติ" onchange="fetchProductData(this.value)">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">ราคาต่อชิ้น (฿)</label>
                    <input type="number" id="price" class="w-full p-3.5 border border-slate-200 rounded-xl text-right font-black text-indigo-600 bg-slate-50/30 text-sm" placeholder="0.00">
                </div>
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">ชื่อรายการสินค้า</label>
                <input type="text" id="productName" class="w-full p-3.5 border border-slate-200 rounded-xl text-slate-700 font-bold text-sm" placeholder="ระบุชื่อสินค้าเด่นชัด">
            </div>
            <div class="flex space-x-2.5 pt-1">
                <div class="w-1/3">
                    <input type="number" id="quantity" value="1" min="1" class="w-full p-3.5 border border-slate-200 rounded-xl text-center font-black text-slate-800 bg-slate-50/50 text-sm">
                </div>
                <button type="button" onclick="addToCart()" class="w-2/3 bg-gradient-to-r from-indigo-600 to-indigo-700 text-white font-bold rounded-xl shadow-md shadow-indigo-600/10 transition transform active:scale-95 text-sm">➕ เพิ่มสินค้าลงบิล</button>
            </div>
        </div>

        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200/60 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2.5">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">🛒 รายการในตะกร้าปัจจุบัน</h3>
                <button onclick="clearCart()" class="text-xs text-rose-500 font-bold hover:underline">ล้างทั้งหมด</button>
            </div>
            <div id="cart-list" class="space-y-2 max-h-48 overflow-y-auto divide-y divide-slate-100 pr-1 text-sm"><p class="text-slate-400 text-center py-6 text-xs font-medium">ยังไม่มีสินค้าในบิลนี้</p></div>
            <div class="bg-gradient-to-r from-emerald-500/5 to-teal-500/5 border border-emerald-500/20 p-4 rounded-2xl flex justify-between items-center mt-3 shadow-inner">
                <span class="text-xs font-bold text-emerald-800">ยอดรวมสุทธิ:</span>
                <span id="grand-total" class="text-2xl font-black text-emerald-600 tracking-tight">0.00 ฿</span>
            </div>
        </div>

        <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-200/60 space-y-3">
            <select id="payment" class="w-full p-3.5 border border-slate-200 rounded-xl bg-white font-bold text-xs text-slate-700 focus:outline-none focus:border-indigo-500 shadow-sm">
                <option value="โอนเงิน">💸 โอนเงินผ่านธนาคาร</option>
                <option value="เงินสด">💵 เงินสด</option>
                <option value="ยังไม่ได้ชำระเงิน">🚨 ยังไม่ได้ชำระเงิน (ติดหนี้ไว้ก่อน)</option>
            </select>
            <button type="button" id="checkoutBtn" onclick="submitOrder()" disabled class="w-full bg-slate-200 text-slate-400 font-bold py-4 rounded-xl text-base shadow-inner cursor-not-allowed transition-all duration-200">🚀 ยืนยันปิดบิลและส่งข้อมูล</button>
        </div>
    </div>

    <div id="reportModal" class="hidden fixed inset-0 bg-slate-950/60 backdrop-blur-md z-50 flex items-end sm:items-center justify-center transition-all duration-300 p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[88vh] flex flex-col shadow-2xl animate-slide-up border border-slate-100">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50 rounded-t-3xl">
                <h2 id="modalTitle" class="font-extrabold text-sm text-slate-800 tracking-tight">รายงาน</h2>
                <button onclick="closeModal()" class="w-8 h-8 bg-slate-200/70 hover:bg-slate-200 text-slate-500 rounded-full font-bold flex items-center justify-center transition text-sm">✕</button>
            </div>
            <div id="modalContent" class="p-4 overflow-y-auto flex-1 space-y-4 text-xs"></div>
        </div>
    </div>

    <div id="successToast" class="hidden fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900/95 text-white px-5 py-4 rounded-2xl flex items-center space-x-3 z-50 shadow-2xl backdrop-blur-xl max-w-[90%] w-[340px] border border-white/10 animate-slide-up">
        <div id="toastIcon" class="w-9 h-9 bg-emerald-500 rounded-xl flex items-center justify-center text-base font-bold text-white shadow-md shadow-emerald-500/20">✓</div>
        <div class="flex-1 min-w-0">
            <div class="font-bold text-xs text-white tracking-wide" id="toastTitle">ระบบแจ้งเตือน</div>
            <div class="text-[11px] text-slate-400 truncate mt-0.5" id="toastMessage">ทำรายการสำเร็จ</div>
        </div>
    </div>

    <script>
        // ⚠️ วาง URL ของ Google Apps Script ของคุณที่นี่ (ลงท้ายด้วย /exec)
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx92ov484ob-O4ncwwjpzhD2E5wgwmuhAguCRD8gBiVpyhCiyqLru0LTCqlnHjwHhtFvg/exec"; 
        
        let cart = []; let html5Qrcode = null; let isCameraOpen = false; let audioCtx = null; let isProcessing = false;

        function unlockAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        function playBeepSound() { try { unlockAudio(); if (!audioCtx) return; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); osc.type = 'sine'; osc.frequency.setValueAtTime(1000, audioCtx.currentTime); gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08); osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.08); } catch(e) {} }
        
        // 🔥 ปรับปรุง UI การแจ้งเตือน Toast Card สวยงามระดับแอปสากล
        function showSuccessToast(message, isError = false) {
            const toast = document.getElementById('successToast');
            const icon = document.getElementById('toastIcon');
            const title = document.getElementById('toastTitle');
            const msgText = document.getElementById('toastMessage');
            
            msgText.innerText = message;
            
            if(isError) {
                title.innerText = "เกิดข้อผิดพลาด";
                icon.innerText = "❌";
                icon.className = "w-9 h-9 bg-rose-500 rounded-xl flex items-center justify-center text-sm font-bold text-white shadow-md shadow-rose-500/20";
            } else {
                title.innerText = "สำเร็จเสร็จสิ้น";
                icon.innerText = "✓";
                icon.className = "w-9 h-9 bg-emerald-500 rounded-xl flex items-center justify-center text-sm font-bold text-white shadow-md shadow-emerald-500/20";
            }
            
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 2500);
        }

        function startCamera() {
            document.getElementById('scan-status').innerText = "⏳ กำลังเชื่อมต่อกล้องระบบพรีเมียม..."; isProcessing = false; if (html5Qrcode) { try { html5Qrcode.clear(); } catch(e) {} } html5Qrcode = new Html5Qrcode("reader", false);
            const ultraFastConfig = { fps: 15, qrbox: function(width, height) { return { width: Math.min(width * 0.85, 300), height: Math.min(height * 0.35, 120) }; }, formatsToSupport: [ Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.CODE_128 ] };
            html5Qrcode.start({ facingMode: { exact: "environment" } }, ultraFastConfig, onScanSuccess, () => {})
            .then(() => { isCameraOpen = true; document.getElementById('laser-line').classList.remove('hidden'); document.getElementById('cameraToggleBtn').innerText = "🔴 ปิดหน้ากล้อง"; document.getElementById('cameraToggleBtn').className = "bg-rose-600 text-white text-[11px] font-bold px-4 py-1.5 rounded-full shadow-sm"; document.getElementById('scan-status').innerText = "🎯 ล็อกเลนส์คมชัดแล้ว เล็งสแกนบาร์โค้ดได้เลย"; setTimeout(() => { try { const videoTrack = html5Qrcode.getRunningTrack(); const capabilities = videoTrack.getCapabilities(); if (capabilities.zoom) { videoTrack.applyConstraints({ advanced: [{ zoom: Math.min(1.4, capabilities.zoom.max), focusMode: "continuous" }] }); } } catch(e) {} }, 700); })
            .catch(err => { html5Qrcode.start({ facingMode: "environment" }, ultraFastConfig, onScanSuccess, () => {}).then(() => { isCameraOpen = true; document.getElementById('laser-line').classList.remove('hidden'); document.getElementById('cameraToggleBtn').innerText = "🔴 ปิดหน้ากล้อง"; }).catch(() => { document.getElementById('scan-status').innerHTML = "❌ ไม่สามารถเข้าถึงสัญญาณกล้องหลังได้"; }); });
        }
        function stopCamera() { if (html5Qrcode && isCameraOpen) { html5Qrcode.stop().then(() => { isCameraOpen = false; document.getElementById('laser-line').classList.add('hidden'); document.getElementById('reader').innerHTML = ""; document.getElementById('cameraToggleBtn').innerText = "📷 เปิดใช้งานกล้อง"; document.getElementById('cameraToggleBtn').className = "bg-slate-900 text-white text-[11px] font-bold px-4 py-1.5 rounded-full shadow-sm"; document.getElementById('scan-status').innerText = "💡 พร้อมเปิดกล้องใหม่อีกครั้ง"; }); } }
        function toggleCamera() { isCameraOpen ? stopCamera() : startCamera(); }
        function onScanSuccess(decodedText) { if (isProcessing) return; isProcessing = true; playBeepSound(); if (navigator.vibrate) navigator.vibrate([80, 40, 80]); document.getElementById('barcode').value = decodedText; fetchProductData(decodedText); setTimeout(() => { stopCamera(); showSuccessToast("จับรหัสสินค้าสำเร็จ!"); }, 300); }

        function fetchProductData(bc) { if(!bc) return; document.getElementById('productName').value = "⏳ สืบค้นข้อมูลคลังแผ่นงาน..."; fetch(`${WEB_APP_URL}?barcode=${bc}&_t=${Date.now()}`).then(r=>r.json()).then(d=>{ if(d.found){ document.getElementById('productName').value = d.name; document.getElementById('price').value = d.price; } else { document.getElementById('productName').value = "คลังไม่มีรหัสนี้ (สามารถพิมพ์ตั้งชื่อเองได้)"; } }); }
        function addToCart() { const b = document.getElementById('barcode').value, n = document.getElementById('productName').value, p = parseFloat(document.getElementById('price').value), q = parseInt(document.getElementById('quantity').value); if(!b || !n || isNaN(p) || q <= 0) { showSuccessToast("กรอกข้อมูลฟอร์มไม่ครบ!", true); return; } cart.push({barcode:b, name:n, price:p, quantity:q}); updateCartUI(); document.getElementById('barcode').value=""; document.getElementById('productName').value=""; document.getElementById('price').value=""; showSuccessToast("เพิ่มเข้าตะกร้าบิลแล้ว"); }
        function updateCartUI() { const list = document.getElementById('cart-list'); let html = "", total = 0; cart.forEach((item, i) => { total += (item.price * item.quantity); html += `<div class="flex justify-between items-center py-2.5 text-slate-700 font-bold text-xs"><div class="truncate max-w-[70%]"><div class="text-slate-800 font-bold truncate">${item.name}</div><div class="text-[10px] text-slate-400 font-mono mt-0.5">รหัส: ${item.barcode} | ${item.price} ฿ × ${item.quantity}</div></div><span class="font-extrabold text-slate-900 text-sm">${(item.price * item.quantity).toFixed(2)} ฿</span></div>`; }); list.innerHTML = cart.length ? html : "<p class='text-slate-400 text-center py-6 text-xs font-medium'>ยังไม่มีสินค้าในบิลนี้</p>"; document.getElementById('grand-total').innerText = total.toFixed(2) + " ฿"; document.getElementById('checkoutBtn').disabled = !cart.length; document.getElementById('checkoutBtn').className = cart.length ? "w-full bg-gradient-to-r from-indigo-600 to-indigo-700 text-white font-bold py-4 rounded-xl text-sm shadow-md active:scale-95 transition-all duration-150 cursor-pointer" : "w-full bg-slate-100 text-slate-400 font-bold py-4 rounded-xl text-sm shadow-inner cursor-not-allowed"; }
        function clearCart() { cart = []; updateCartUI(); }
        function submitOrder() { if(!cart.length) return; const cust = document.getElementById('customerName').value.trim(); const pay = document.getElementById('payment').value; if(pay === "ยังไม่ได้ชำระเงิน" && cust === "ทั่วไป") { showSuccessToast("กรุณาระบุชื่อคนติดหนี้ค้างจ่าย!", true); return; } document.getElementById('checkoutBtn').disabled = true; document.getElementById('checkoutBtn').innerText = "⏳ ระบบกำลังส่งข้อมูลเข้า Sheets..."; fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ payment: pay, customer: cust, items: cart }) }).then(() => { showSuccessToast("🎉 บันทึกปิดบิลเข้าคลังสำเร็จ!"); clearCart(); document.getElementById('customerName').value = "ทั่วไป"; }).finally(() => { document.getElementById('checkoutBtn').innerText = "🚀 ยืนยันปิดบิลและส่งข้อมูล"; updateCartUI(); }); }
        
        function openAddProductModal() {
            let html = `<div class="space-y-4 p-1 text-slate-700"><p class="text-xs font-bold text-slate-400 uppercase tracking-wide">📦 แบบฟอร์มเพิ่มสินค้าใหม่เข้าฐานข้อมูล</p><div class="space-y-3"><div><label class="block text-[11px] font-bold text-slate-500 mb-1">เลขบาร์โค้ด / รหัสสินค้า</label><input type="text" id="newPBarcode" class="w-full p-3.5 border border-slate-200 rounded-xl font-mono font-bold text-sm bg-slate-50 focus:bg-white focus:outline-none focus:border-indigo-500" placeholder="พิมพ์หรือสแกนรหัสที่นี่"></div><div><label class="block text-[11px] font-bold text-slate-500 mb-1">ชื่อรายการสินค้า</label><input type="text" id="newPName" class="w-full p-3.5 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 text-sm font-bold" placeholder="เช่น นมจืดตราหมี 200ml"></div><div><label class="block text-[11px] font-bold text-slate-500 mb-1">ราคาตั้งขายต่อชิ้น (บาท)</label><input type="number" id="newPPrice" class="w-full p-3.5 border border-slate-200 rounded-xl font-black text-indigo-600 focus:outline-none focus:border-indigo-500 text-sm" placeholder="0.00"></div></div><button onclick="submitNewProduct()" id="saveProductBtn" class="w-full bg-gradient-to-r from-indigo-600 to-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md transition active:scale-95 text-sm">💾 บันทึกสินค้าลงคลังแผ่นงาน</button></div>`;
            showModal("📦 เพิ่มรายการสินค้าใหม่", html);
        }

        function submitNewProduct() {
            const barcode = document.getElementById('newPBarcode').value.trim(), name = document.getElementById('newPName').value.trim(), price = document.getElementById('newPPrice').value.trim();
            if(!barcode || !name || !price || isNaN(price)) { alert("🚨 กรุณากรอกข้อมูลสินค้าให้ครบถ้วน!"); return; }
            document.getElementById('saveProductBtn').disabled = true; document.getElementById('saveProductBtn').innerText = "⏳ กำลังส่งข้อมูล..."; showSuccessToast("⏳ กำลังเพิ่มสินค้าเข้าคลัง...");
            const productData = new URLSearchParams(); productData.append('action', 'addNewProduct'); productData.append('barcode', barcode); productData.append('name', name); productData.append('price', price);
            fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: productData.toString(), mode: 'no-cors' }).then(() => { showSuccessToast("🎉 เพิ่มสินค้าลงคลังเรียบร้อย!"); closeModal(); }).finally(() => { document.getElementById('saveProductBtn').disabled = false; document.getElementById('saveProductBtn').innerText = "💾 บันทึกสินค้าลงคลังแผ่นงาน"; });
        }

        function openHistoryModal() { 
            showModal("📊 รายงานสรุปยอดขายรายวัน", "<p class='text-center py-4 text-slate-400 animate-pulse font-medium'>⏳ กำลังประมวลผลบัญชีรายวัน...</p>"); 
            fetch(`${WEB_APP_URL}?action=getHistory&_t=${Date.now()}`).then(r=>r.json()).then(data => { 
                const dailyTotals = {}; const dailyItems = {};
                data.forEach(i => { if(!dailyTotals[i.date]) { dailyTotals[i.date] = 0; dailyItems[i.date] = []; } dailyTotals[i.date] += i.total; dailyItems[i.date].push(i); }); 
                let html = '<div class="space-y-3 max-h-[72vh] overflow-y-auto pr-1">'; let dayIndex = 0;
                for(const date in dailyTotals) { 
                    dayIndex++;
                    html += `
                        <div class="bg-white border border-slate-100 rounded-2xl shadow-sm overflow-hidden">
                            <div onclick="toggleDayDetails(${dayIndex})" class="p-4 flex justify-between items-center bg-slate-50/50 hover:bg-slate-100/50 active:bg-slate-200/40 cursor-pointer select-none transition">
                                <div class="flex items-center space-x-2.5">
                                    <span id="arrow-icon-${dayIndex}" class="text-[10px] text-slate-400 transition-transform duration-200">▶</span>
                                    <span class="font-extrabold text-slate-700 text-xs sm:text-sm">📅 ${date}</span>
                                </div>
                                <div class="text-right">
                                    <span class="text-[9px] text-slate-400 block font-bold">รวมวันนี้</span>
                                    <span class="font-black text-indigo-600 text-sm sm:text-base">${dailyTotals[date].toFixed(2)} ฿</span>
                                </div>
                            </div>
                            <div id="details-box-${dayIndex}" class="hidden border-t border-slate-50 bg-white p-3 divide-y divide-slate-50">
                    `;
                    dailyItems[date].forEach(item => {
                        html += `
                            <div class="flex justify-between py-2.5 text-xs items-center">
                                <div class="space-y-0.5 truncate max-w-[70%]">
                                    <div class="font-bold text-slate-800 truncate">${item.name}</div>
                                    <div class="text-[10px] text-slate-400 font-medium">🕒 ${item.time} - ผู้ซื้อ: ${item.customer}</div>
                                </div>
                                <div class="text-right">
                                    <div class="font-black text-slate-800">${item.total.toFixed(2)} ฿</div>
                                    <div class="text-[9px] ${item.payment === 'ยังไม่ได้ชำระเงิน' ? 'text-rose-500 font-bold' : 'text-emerald-600 font-bold'}">(${item.payment})</div>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div></div>`; 
                } 
                html += '</div>'; document.getElementById('modalContent').innerHTML = dayIndex > 0 ? html : "<p class='text-slate-400 text-center py-6'>ไม่มีข้อมูลประวัติยอดขาย</p>"; 
            }); 
        }
        function toggleDayDetails(index) {
            const box = document.getElementById(`details-box-${index}`), arrow = document.getElementById(`arrow-icon-${index}`);
            if (box.classList.contains('hidden')) { box.classList.remove('hidden'); arrow.style.transform = 'rotate(90deg)'; } 
            else { box.classList.add('hidden'); arrow.style.transform = 'rotate(0deg)'; }
        }

        function openStockModal() {
            showModal("📦 รายการสินค้าคงเหลือในคลัง", "<p class='text-center py-4 text-slate-400 animate-pulse font-medium'>⏳ กำลังเชื่อมต่อฐานข้อมูลคลัง...</p>");
            fetch(`${WEB_APP_URL}?action=getProductsData&_t=${Date.now()}`).then(r => r.json()).then(products => {
                let stockHtml = '<div class="space-y-2.5 max-h-[72vh] overflow-y-auto pr-1">';
                if(products && products.length > 0) {
                    products.forEach(p => {
                        const isOut = p.stock <= 0;
                        stockHtml += `
                            <div class="bg-white border ${isOut ? 'border-rose-100 bg-rose-50/20' : 'border-slate-100'} p-4 rounded-2xl shadow-sm flex justify-between items-center">
                                <div class="truncate max-w-[65%]">
                                    <div class="font-bold ${isOut ? 'text-rose-700' : 'text-slate-700'} text-xs sm:text-sm truncate">${p.name}</div>
                                    <div class="text-[10px] text-slate-400 font-mono mt-0.5">รหัส: ${p.barcode} | ราคา: ${p.price.toFixed(2)} ฿</div>
                                </div>
                                <div class="text-right">
                                    <span class="text-[9px] text-slate-400 block font-bold">สต๊อกจริง</span>
                                    <span class="font-black ${isOut ? 'text-rose-600 bg-rose-100 px-2 py-0.5 rounded-md animate-pulse' : 'text-emerald-600'} text-sm">
                                        ${p.stock} ชิ้น
                                    </span>
                                </div>
                            </div>
                        `;
                    });
                    stockHtml += '</div>'; document.getElementById('modalContent').innerHTML = stockHtml;
                } else {
                    document.getElementById('modalContent').innerHTML = "<p class='text-slate-400 text-center py-6'>ไม่พบรายการสินค้าในหน้าแท็บ Products</p>";
                }
            }).catch(() => { document.getElementById('modalContent').innerHTML = "<p class='text-slate-400 text-center py-6 text-rose-500 font-bold'>❌ ระบบขัดข้อง กรุณาเช็กการ Deploy ของหลังบ้านครับ</p>"; });
        }

        function openUnpaidModal() { 
            showModal("🚨 รายชื่อลูกค้าค้างจ่ายเงิน", "<p class='text-center py-4 text-slate-400 animate-pulse font-medium'>⏳ กำลังรวบรวมบิลคงค้าง...</p>"); 
            fetch(`${WEB_APP_URL}?action=getHistory&_t=${Date.now()}`).then(r=>r.json()).then(data => {
                const unpaid = data.filter(i => i.payment === "ยังไม่ได้ชำระเงิน"); 
                const debts = {}; unpaid.forEach(i => { if(!debts[i.customer]) debts[i.customer] = {total:0, list:[]}; debts[i.customer].total += i.total; debts[i.customer].list.push(i); }); 
                let html = ""; let customerIndex = 0;
                for(const c in debts) { 
                    customerIndex++;
                    html += `
                        <div id="debt-box-${customerIndex}" class="bg-rose-50/40 border border-rose-100 p-4 rounded-2xl mb-3 transition-all duration-300">
                            <div class="flex justify-between items-center border-b border-rose-100/60 pb-2 text-xs font-bold text-rose-900">
                                <div class="flex flex-col">
                                    <span class="font-bold text-slate-800 text-sm">👤 คุณ ${c}</span>
                                    <span class="text-[10px] text-rose-500 font-bold mt-0.5">ยอดรวมค้าง: ${debts[c].total.toFixed(2)} ฿</span>
                                </div>
                                <button onclick="clearAllCustomerDebt('${c}', ${customerIndex})" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-bold px-3 py-1.5 rounded-xl shadow-sm transition">💸 จ่ายเงินครบแล้ว</button>
                            </div>
                            <div class="text-[10px] text-slate-500 pt-2.5 space-y-2 max-h-[40vh] overflow-y-auto">
                    `; 
                    debts[c].list.forEach(i => { html += `<div class="flex justify-between items-center bg-white p-2.5 rounded-xl border border-slate-100 shadow-sm font-medium"><span class="text-slate-700">• ${i.name} (x${i.quantity})</span><span class="font-bold text-slate-800">${i.total.toFixed(2)} ฿</span></div>`; }); 
                    html += `</div></div>`; 
                } 
                document.getElementById('modalContent').innerHTML = html || "🎉 ไม่พบยอดค้างชำระเงิน"; 
            }); 
        }

        function clearAllCustomerDebt(customerName, boxIndex) {
            const targetBox = document.getElementById(`debt-box-${boxIndex}`);
            if (targetBox) { targetBox.style.opacity = '0'; targetBox.style.transform = 'scale(0.95)'; setTimeout(() => { targetBox.remove(); if(document.querySelectorAll('[id^="debt-box-"]').length === 0) { document.getElementById('modalContent').innerHTML = "🎉 ไม่พบยอดค้างชำระเงิน"; } }, 300); }
            showSuccessToast(`💸 เคลียร์หนี้ คุณ ${customerName} สำเร็จ!`);
            const formDetails = new URLSearchParams(); formDetails.append('action', 'clearCustomerDebt'); formDetails.append('customerName', customerName);
            fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: formDetails.toString(), mode: 'no-cors' }).then(() => { setTimeout(() => { fetch(`${WEB_APP_URL}?action=getHistory&_t=${Date.now()}`); }, 1000); }).catch(err => console.log(err));
        }

        function showModal(title, text) { document.getElementById('reportModal').classList.remove('hidden'); document.getElementById('modalTitle').innerText = title; document.getElementById('modalContent').innerHTML = text; }
        function closeModal() { document.getElementById('reportModal').classList.add('hidden'); }
    </script>
</body>
</html>
