<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium POS Mobile - Interactive Daily Sales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        #reader button, #reader img { display: none !important; }
        #reader { border: none !important; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; image-rendering: -webkit-optimize-contrast !important; image-rendering: crisp-edges !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-24 text-slate-800" onclick="unlockAudio()">

    <div class="bg-indigo-600 text-white px-3 py-3 shadow-lg sticky top-0 z-40 bg-opacity-95 backdrop-blur-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-1">
                <span class="text-lg">⚡</span>
                <span class="font-bold text-sm tracking-wide">Premium POS</span>
            </div>
            <div class="flex space-x-1 text-[11px] font-bold">
                <button onclick="openAddProductModal()" class="bg-fuchsia-500 text-white px-2.5 py-1.5 rounded-xl border border-fuchsia-400/30 shadow transition active:scale-95">📦 + เพิ่มสินค้า</button>
                <button onclick="openUnpaidModal()" class="bg-rose-500/20 text-rose-200 border border-rose-500/30 px-2 py-1.5 rounded-xl transition active:scale-95">🚨 ค้างชำระ</button>
                <button onclick="openHistoryModal()" class="bg-white/10 text-indigo-100 border border-white/20 px-2 py-1.5 rounded-xl transition active:scale-95">📊 ยอดขาย</button>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-4">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-3">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">เครื่องสแกนบาร์โค้ด (บังคับกล้องหลัง)</span>
                <button id="cameraToggleBtn" onclick="toggleCamera()" class="bg-rose-500 text-white text-xs font-bold px-4 py-1.5 rounded-full shadow-sm transition-all duration-200">🔴 กล้องปิดอยู่ (คลิกเปิด)</button>
            </div>
            <div class="relative w-full bg-slate-900 rounded-xl overflow-hidden aspect-[4/3] border border-slate-200 shadow-inner flex items-center justify-center">
                <div id="reader" class="w-full h-full"></div>
                <div id="laser-line" class="hidden absolute left-0 right-0 h-0.5 bg-rose-500/90 shadow-[0_0_8px_rgba(244,63,94,1)] animate-pulse"></div>
            </div>
            <div id="scan-status" class="text-center text-xs font-medium text-slate-400 mt-2.5">💡 แนะนำให้กดปุ่มเปิดกล้องเพื่อเริ่มใช้งาน</div>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">👤 ลูกค้า / ผู้ซื้อ</label>
                <input type="text" id="customerName" value="ทั่วไป" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 focus:outline-none focus:border-indigo-500 focus:bg-white transition-all">
            </div>
            <div class="border-t border-slate-100 my-2"></div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">รหัสสินค้า</label>
                    <input type="text" id="barcode" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-mono font-bold text-slate-700" placeholder="สแกนหรือพิมพ์" onchange="fetchProductData(this.value)">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">ราคา/ชิ้น (฿)</label>
                    <input type="number" id="price" class="w-full p-3 border border-slate-200 rounded-xl text-right font-bold text-indigo-600" placeholder="0.00">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">ชื่อรายการสินค้า</label>
                <input type="text" id="productName" class="w-full p-3 border border-slate-200 rounded-xl text-slate-700 font-medium" placeholder="ระบุชื่อสินค้า">
            </div>
            <div class="flex space-x-2">
                <div class="w-1/3">
                    <input type="number" id="quantity" value="1" min="1" class="w-full p-3 border border-slate-200 rounded-xl text-center font-bold text-slate-700">
                </div>
                <button type="button" onclick="addToCart()" class="w-2/3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition transform active:scale-95">➕ เพิ่มลงในบิล</button>
            </div>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-3">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">🛒 รายการสินค้าในบิล</h3>
                <button onclick="clearCart()" class="text-xs text-rose-500 hover:underline">ล้างทั้งหมด</button>
            </div>
            <div id="cart-list" class="space-y-2 max-h-40 overflow-y-auto divide-y divide-slate-50 pr-1 text-sm"><p class="text-slate-400 text-center py-4 text-xs">ไม่มีสินค้าในตะกร้า</p></div>
            <div class="bg-emerald-50/50 border border-emerald-100 p-3 rounded-xl flex justify-between items-center mt-2">
                <span class="text-xs font-bold text-emerald-800">ยอดรวมทั้งสิ้น:</span>
                <span id="grand-total" class="text-2xl font-black text-emerald-600">0.00 ฿</span>
            </div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
            <select id="payment" class="w-full p-3 border border-slate-200 rounded-xl bg-white font-medium text-xs text-slate-700 focus:outline-none focus:border-indigo-500">
                <option value="โอนเงิน">💸 โอนเงินผ่านธนาคาร</option>
                <option value="เงินสด">💵 เงินสด</option>
                <option value="ยังไม่ได้ชำระเงิน">🚨 ยังไม่ได้ชำระเงิน (ติดหนี้ไว้ก่อน)</option>
            </select>
            <button type="button" id="checkoutBtn" onclick="submitOrder()" disabled class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl text-base shadow-md active:scale-95 transition-all duration-150 cursor-pointer">🚀 ยืนยันการขาย (บันทึกข้อมูล)</button>
        </div>
    </div>

    <div id="reportModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center transition-all duration-300"><div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[94vh] flex flex-col shadow-2xl animate-slide-up"><div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-3xl sm:rounded-t-3xl"><h2 id="modalTitle" class="font-bold text-sm text-slate-700">รายงาน</h2><button onclick="closeModal()" class="w-8 h-8 bg-slate-200 text-slate-500 rounded-full font-bold flex items-center justify-center">✕</button></div><div id="modalContent" class="p-4 overflow-y-auto flex-1 space-y-4 text-xs"></div></div></div>

    <div id="successToast" class="hidden fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-slate-900/90 text-white px-6 py-5 rounded-2xl flex flex-col items-center justify-center space-y-2 z-50 shadow-2xl backdrop-blur-md max-w-[250px] text-center border border-white/10">
        <div id="toastIcon" class="w-12 h-12 bg-emerald-500 rounded-full flex items-center justify-center text-xl font-bold">✓</div>
        <div class="font-bold text-sm" id="toastMessage">บันทึกสำเร็จ</div>
    </div>

    <script>
        // ⚠️ วาง URL ของ Google Apps Script ของคุณที่นี่ (ลงท้ายด้วย /exec)
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx92ov484ob-O4ncwwjpzhD2E5wgwmuhAguCRD8gBiVpyhCiyqLru0LTCqlnHjwHhtFvg/exec"; 
        
        let cart = []; let html5Qrcode = null; let isCameraOpen = false; let audioCtx = null; let isProcessing = false;

        function unlockAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        function playBeepSound() { try { unlockAudio(); if (!audioCtx) return; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); osc.type = 'sine'; osc.frequency.setValueAtTime(1000, audioCtx.currentTime); gain.gain.setValueAtTime(0.4, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08); osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.08); } catch(e) { console.log(e); } }
        function showSuccessToast(message, isError = false) { const toast = document.getElementById('successToast'); const icon = document.getElementById('toastIcon'); document.getElementById('toastMessage').innerText = message; if(isError) { icon.innerText = "❌"; icon.className = "w-12 h-12 bg-rose-500 rounded-full flex items-center justify-center text-xl font-bold"; } else { icon.innerText = "✓"; icon.className = "w-12 h-12 bg-emerald-500 rounded-full flex items-center justify-center text-xl font-bold"; } toast.classList.remove('hidden'); setTimeout(() => { toast.classList.add('hidden'); }, 2000); }

        function startCamera() {
            document.getElementById('scan-status').innerText = "⏳ กำลังบังคับเปิดเลนส์กล้องหลัง..."; isProcessing = false; if (html5Qrcode) { try { html5Qrcode.clear(); } catch(e) {} } html5Qrcode = new Html5Qrcode("reader", false);
            const ultraFastConfig = { fps: 15, qrbox: function(width, height) { return { width: Math.min(width * 0.85, 300), height: Math.min(height * 0.35, 120) }; }, formatsToSupport: [ Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.CODE_128 ] };
            html5Qrcode.start({ facingMode: { exact: "environment" } }, ultraFastConfig, onScanSuccess, () => {})
            .then(() => { isCameraOpen = true; document.getElementById('laser-line').classList.remove('hidden'); document.getElementById('cameraToggleBtn').innerText = "🟢 เปิดอยู่ (กล้องหลัง)"; document.getElementById('cameraToggleBtn').className = "bg-emerald-500 text-white text-xs font-bold px-4 py-1.5 rounded-full shadow-sm"; document.getElementById('scan-status').innerText = "🎯 ระบบล็อกกล้องหลังเรียบร้อย ยิงบาร์โค้ดได้เลย"; setTimeout(() => { try { const videoTrack = html5Qrcode.getRunningTrack(); const capabilities = videoTrack.getCapabilities(); if (capabilities.zoom) { videoTrack.applyConstraints({ advanced: [{ zoom: Math.min(1.4, capabilities.zoom.max), focusMode: "continuous" }] }); } } catch(e) {} }, 700); })
            .catch(err => { html5Qrcode.start({ facingMode: "environment" }, ultraFastConfig, onScanSuccess, () => {}).then(() => { isCameraOpen = true; document.getElementById('laser-line').classList.remove('hidden'); document.getElementById('cameraToggleBtn').innerText = "🟢 เปิดอยู่ (เลนส์หลังมาตรฐาน)"; document.getElementById('cameraToggleBtn').className = "bg-emerald-500 text-white text-xs font-bold px-4 py-1.5 rounded-full shadow-sm"; }).catch(() => { document.getElementById('scan-status').innerHTML = "❌ ไม่สามารถเข้าถึงกล้องหลังได้"; }); });
        }
        function stopCamera() { if (html5Qrcode && isCameraOpen) { html5Qrcode.stop().then(() => { isCameraOpen = false; document.getElementById('laser-line').classList.add('hidden'); document.getElementById('reader').innerHTML = ""; document.getElementById('cameraToggleBtn').innerText = "🔴 ปิดอยู่ (คลิกเปิด)"; document.getElementById('cameraToggleBtn').className = "bg-rose-500 text-white text-xs font-bold px-4 py-1.5 rounded-full shadow-sm"; document.getElementById('scan-status').innerText = "💡 พร้อมเปิดกล้องใหม่อีกครั้ง"; }); } }
        function toggleCamera() { isCameraOpen ? stopCamera() : startCamera(); }
        function onScanSuccess(decodedText) { if (isProcessing) return; isProcessing = true; playBeepSound(); if (navigator.vibrate) navigator.vibrate([80, 40, 80]); document.getElementById('barcode').value = decodedText; fetchProductData(decodedText); setTimeout(() => { stopCamera(); showSuccessToast("จับรหัสสินค้าสำเร็จ!"); }, 300); }

        function fetchProductData(bc) { if(!bc) return; document.getElementById('productName').value = "⏳ กำลังสืบค้นจาก Google Sheet..."; fetch(`${WEB_APP_URL}?barcode=${bc}&_t=${Date.now()}`).then(r=>r.json()).then(d=>{ if(d.found){ document.getElementById('productName').value = d.name; document.getElementById('price').value = d.price; } else { document.getElementById('productName').value = "คลังแผ่นงานไม่มีรหัสนี้ (พิมพ์ตั้งชื่อสินค้าเองได้)"; } }); }
        function addToCart() { const b = document.getElementById('barcode').value, n = document.getElementById('productName').value, p = parseFloat(document.getElementById('price').value), q = parseInt(document.getElementById('quantity').value); if(!b || !n || isNaN(p) || q <= 0) { showSuccessToast("กรอกข้อมูลไม่ครบถ้วน!", true); return; } cart.push({barcode:b, name:n, price:p, quantity:q}); updateCartUI(); document.getElementById('barcode').value=""; document.getElementById('productName').value=""; document.getElementById('price').value=""; showSuccessToast("เพิ่มเข้าตะกร้าแล้ว"); }
        function updateCartUI() { const list = document.getElementById('cart-list'); let html = "", total = 0; cart.forEach((item, i) => { total += (item.price * item.quantity); html += `<div class="flex justify-between items-center py-2 text-slate-700 font-medium"><div class="truncate"><div class="font-bold">${item.name}</div><div class="text-[11px] text-slate-400 font-mono">รหัส: ${item.barcode} | ${item.price} ฿ × ${item.quantity}</div></div><span class="font-bold text-slate-800">${(item.price * item.quantity).toFixed(2)} ฿</span></div>`; }); list.innerHTML = cart.length ? html : "<p class='text-slate-400 text-center py-4 text-xs'>ไม่มีสินค้าในตะกร้า</p>"; document.getElementById('grand-total').innerText = total.toFixed(2) + " ฿"; document.getElementById('checkoutBtn').disabled = !cart.length; document.getElementById('checkoutBtn').className = cart.length ? "w-full bg-indigo-600 text-white font-bold py-4 rounded-xl text-base shadow-md active:scale-95 transition-all duration-150 cursor-pointer" : "w-full bg-slate-300 text-slate-500 font-bold py-4 rounded-xl text-base shadow-sm cursor-not-allowed"; }
        function clearCart() { cart = []; updateCartUI(); }
        function submitOrder() { if(!cart.length) return; const cust = document.getElementById('customerName').value.trim(); const pay = document.getElementById('payment').value; if(pay === "ยังไม่ได้ชำระเงิน" && cust === "ทั่วไป") { showSuccessToast("กรุณาใส่ชื่อคนค้างจ่าย!", true); return; } document.getElementById('checkoutBtn').disabled = true; document.getElementById('checkoutBtn').innerText = "⏳ กำลังบันทึกธุรกรรม..."; fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ payment: pay, customer: cust, items: cart }) }).then(() => { showSuccessToast("🎉 บันทึกเข้า Google Sheet สำเร็จ!"); clearCart(); document.getElementById('customerName').value = "ทั่วไป"; }).finally(() => { document.getElementById('checkoutBtn').innerText = "🚀 ยืนยันการขาย (บันทึกข้อมูล)"; updateCartUI(); }); }
        
        function openAddProductModal() {
            let html = `<div class="space-y-4 p-1 text-slate-700"><p class="text-xs font-bold text-slate-400 uppercase tracking-wide">📦 แบบฟอร์มเพิ่มสินค้าใหม่เข้าฐานข้อมูล</p><div class="space-y-3"><div><label class="block text-[11px] font-bold text-slate-500 mb-1">เลขบาร์โค้ด / รหัสสินค้า</label><input type="text" id="newPBarcode" class="w-full p-3 border border-slate-200 rounded-xl font-mono font-bold text-sm bg-slate-50 focus:bg-white focus:outline-none focus:border-indigo-500" placeholder="พิมพ์หรือสแกนรหัสที่นี่"></div><div><label class="block text-[11px] font-bold text-slate-500 mb-1">ชื่อรายการสินค้า</label><input type="text" id="newPName" class="w-full p-3 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500" placeholder="เช่น นมจืดตราหมี 200ml"></div><div><label class="block text-[11px] font-bold text-slate-500 mb-1">ราคาตั้งขายต่อชิ้น (บาท)</label><input type="number" id="newPPrice" class="w-full p-3 border border-slate-200 rounded-xl font-bold text-indigo-600 focus:outline-none focus:border-indigo-500" placeholder="0.00"></div></div><button onclick="submitNewProduct()" id="saveProductBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md transition active:scale-95">💾 บันทึกสินค้าลงคลังแผ่นงาน</button></div>`;
            showModal("📦 เพิ่มรายการสินค้าใหม่", html);
        }

        function submitNewProduct() {
            const barcode = document.getElementById('newPBarcode').value.trim(), name = document.getElementById('newPName').value.trim(), price = document.getElementById('newPPrice').value.trim();
            if(!barcode || !name || !price || isNaN(price)) { alert("🚨 กรุณากรอกข้อมูลสินค้าให้ครบถ้วน!"); return; }
            document.getElementById('saveProductBtn').disabled = true; document.getElementById('saveProductBtn').innerText = "⏳ กำลังเชื่อมต่อแผ่นงาน..."; showSuccessToast("⏳ กำลังเพิ่มสินค้าเข้าคลัง...");
            const productData = new URLSearchParams(); productData.append('action', 'addNewProduct'); productData.append('barcode', barcode); productData.append('name', name); productData.append('price', price);
            fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: productData.toString(), mode: 'no-cors' }).then(() => { showSuccessToast("🎉 เพิ่มสินค้าลง Sheets เรียบร้อย!"); closeModal(); }).finally(() => { document.getElementById('saveProductBtn').disabled = false; document.getElementById('saveProductBtn').innerText = "💾 บันทึกสินค้าลงคลังแผ่นงาน"; });
        }

        // 🔥 อัปเดต: โหมดประวัติอัจฉริยะ (สรุปยอดรวมรายวันเฉยๆ แต่กดที่การ์ดแล้วจะกางรายละเอียดสินค้าในวันนั้นโชว์)
        function openHistoryModal() { 
            showModal("📊 รายงานสรุปยอดขายรายวัน", "<p class='text-center py-4 text-slate-400 animate-pulse'>⏳ กำลังรวบรวมบัญชีรายวันจากแผ่นงาน...</p>"); 
            fetch(`${WEB_APP_URL}?action=getHistory&_t=${Date.now()}`).then(r=>r.json()).then(data => { 
                const dailyTotals = {}; 
                const dailyItems = {};
                
                // จัดระเบียบข้อมูล: คำนวณยอดเงินรวม และ จัดกลุ่มสินค้าแยกตามวันที่
                data.forEach(i => { 
                    if(!dailyTotals[i.date]) {
                        dailyTotals[i.date] = 0;
                        dailyItems[i.date] = [];
                    }
                    dailyTotals[i.date] += i.total; 
                    dailyItems[i.date].push(i);
                }); 
                
                let html = '<div class="space-y-3 max-h-[75vh] overflow-y-auto pr-1">'; 
                let dayIndex = 0;
                
                for(const date in dailyTotals) { 
                    dayIndex++;
                    
                    html += `
                        <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                            <div onclick="toggleDayDetails(${dayIndex})" class="p-4 flex justify-between items-center bg-slate-50/50 hover:bg-slate-100/50 active:bg-slate-200/40 cursor-pointer select-none transition">
                                <div class="flex items-center space-x-2.5">
                                    <span id="arrow-icon-${dayIndex}" class="text-xs text-slate-400 transition-transform duration-200">▶</span>
                                    <span class="font-bold text-slate-700 text-xs sm:text-sm">📅 ${date}</span>
                                </div>
                                <div class="text-right">
                                    <span class="text-[10px] text-slate-400 block font-medium">รวมวันนี้นะ</span>
                                    <span class="font-black text-indigo-600 text-sm sm:text-base">${dailyTotals[date].toFixed(2)} ฿</span>
                                </div>
                            </div>
                            
                            <div id="details-box-${dayIndex}" class="hidden border-t border-slate-100 bg-white p-3 divide-y divide-slate-50">
                    `;
                    
                    // วนลูปวาดรายการบิลขายย่อยทั้งหมดของวันนั้นออกมาสแตนด์บายรอไว้
                    dailyItems[date].forEach(item => {
                        html += `
                            <div class="flex justify-between py-2 text-[11px] text-slate-600 items-center">
                                <div class="space-y-0.5 truncate max-w-[70%]">
                                    <div class="font-bold text-slate-700 truncate">${item.name}</div>
                                    <div class="text-[10px] text-slate-400">🕒 ${item.time} - ลูกค้า: ${item.customer}</div>
                                </div>
                                <div class="text-right font-mono">
                                    <div class="font-bold text-slate-800">${item.total.toFixed(2)} ฿</div>
                                    <div class="text-[9px] ${item.payment === 'ยังไม่ได้ชำระเงิน' ? 'text-rose-500 font-bold' : 'text-emerald-600 font-medium'}">(${item.payment})</div>
                                </div>
                            </div>
                        `;
                    });
                    
                    html += `
                            </div>
                        </div>
                    `; 
                } 
                html += '</div>';
                
                document.getElementById('modalContent').innerHTML = dayIndex > 0 ? html : "<p class='text-slate-400 text-center py-6'>ไม่มีข้อมูลประวัติยอดขายในคลัง</p>"; 
            }); 
        }

        // 🔥 ฟังก์ชันควบคุม เอฟเฟกต์การกาง/หุบ ดูรายการสินค้ารายวันบนหน้าจอ
        function toggleDayDetails(index) {
            const box = document.getElementById(`details-box-${index}`);
            const arrow = document.getElementById(`arrow-icon-${index}`);
            
            if (box.classList.contains('hidden')) {
                box.classList.remove('hidden');
                arrow.style.transform = 'rotate(90deg)'; // หมุนลูกศรลงล่างให้รู้ว่ากางแล้ว
            } else {
                box.classList.add('hidden');
                arrow.style.transform = 'rotate(0deg)';  // หมุนลูกศรกลับไปชี้ทางขวา
            }
        }

        function openUnpaidModal() { 
            showModal("🚨 รายชื่อลูกค้าค้างจ่ายเงิน", "<p class='text-center py-4 text-slate-400 animate-pulse'>⏳ กำลังประมวลผลบิลคงค้าง...</p>"); 
            fetch(`${WEB_APP_URL}?action=getHistory&_t=${Date.now()}`).then(r=>r.json()).then(data => {
                const unpaid = data.filter(i => i.payment === "ยังไม่ได้ชำระเงิน"); 
                const debts = {}; unpaid.forEach(i => { if(!debts[i.customer]) debts[i.customer] = {total:0, list:[]}; debts[i.customer].total += i.total; debts[i.customer].list.push(i); }); 
                let html = ""; let customerIndex = 0;
                for(const c in debts) { 
                    customerIndex++;
                    html += `<div id="debt-box-${customerIndex}" class="bg-rose-50/70 border border-rose-100 p-3 rounded-xl mb-3 transition-all duration-300"><div class="flex justify-between items-center border-b border-rose-100 pb-2 text-xs font-bold text-rose-900"><div class="flex flex-col"><span>👤 คุณ ${c}</span><span class="text-[10px] text-rose-500 font-normal">ยอดรวมค้าง: ${debts[c].total.toFixed(2)} ฿</span></div><button onclick="clearAllCustomerDebt('${c}', ${customerIndex})" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg shadow-sm active:scale-95 transition">💸 จ่ายเงินครบแล้ว</button></div><div class="text-[10px] text-slate-500 pt-2 space-y-1.5 max-h-[50vh] overflow-y-auto">`; 
                    debts[c].list.forEach(i => { html += `<div class="flex justify-between items-center bg-white/60 p-2 rounded border border-slate-100 shadow-sm"><span>• ${i.name} (x${i.quantity})</span><span class="font-mono font-bold text-slate-700">${i.total.toFixed(2)} ฿</span></div>`; }); 
                    html += `</div></div>`; 
                } 
                document.getElementById('modalContent').innerHTML = html || "🎉 ไม่พบรายชื่อคนค้างชำระเงิน"; 
            }); 
        }

        function clearAllCustomerDebt(customerName, boxIndex) {
            const targetBox = document.getElementById(`debt-box-${boxIndex}`);
            if (targetBox) { targetBox.style.opacity = '0'; targetBox.style.transform = 'scale(0.9)'; setTimeout(() => { targetBox.remove(); if(document.querySelectorAll('[id^="debt-box-"]').length === 0) { document.getElementById('modalContent').innerHTML = "🎉 ไม่พบรายชื่อคนค้างชำระเงิน"; } }, 300); }
            showSuccessToast(`💸 เคลียร์หนี้ คุณ ${customerName} สำเร็จ!`);
            const formDetails = new URLSearchParams(); formDetails.append('action', 'clearCustomerDebt'); formDetails.append('customerName', customerName);
            fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: formDetails.toString(), mode: 'no-cors' }).then(() => { setTimeout(() => { fetch(`${WEB_APP_URL}?action=getHistory&_t=${Date.now()}`); }, 1000); }).catch(err => console.log(err));
        }

        function showModal(title, text) { document.getElementById('reportModal').classList.remove('hidden'); document.getElementById('modalTitle').innerText = title; document.getElementById('modalContent').innerHTML = text; }
        function closeModal() { document.getElementById('reportModal').classList.add('hidden'); }
    </script>
</body>
</html>
