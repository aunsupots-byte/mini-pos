<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium POS Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        /* ซ่อนขยะหรือปุ่มดั้งเดิมของ Library ไม่ให้มารกสายตา */
        #reader button { display: none !important; }
        #reader img { display: none !important; }
        #reader { border: none !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-24 text-slate-800" onclick="unlockAudio()">

    <div class="bg-indigo-600 text-white px-4 py-3 shadow-lg sticky top-0 z-40 backdrop-blur-md bg-opacity-95">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-xl">⚡</span>
                <span class="font-bold text-base tracking-wide">Premium POS</span>
            </div>
            <div class="flex space-x-1.5 text-xs font-bold">
                <button onclick="openUnpaidModal()" class="bg-rose-500/20 text-rose-200 border border-rose-500/30 px-3 py-1.5 rounded-xl transition active:scale-95">🚨 ค้างชำระ</button>
                <button onclick="openHistoryModal()" class="bg-white/10 text-indigo-100 border border-white/20 px-3 py-1.5 rounded-xl transition active:scale-95">📊 ยอดขาย</button>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-4">
        
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-3">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">เครื่องสแกนบาร์โค้ด</span>
                <button id="cameraToggleBtn" onclick="toggleCamera()" class="bg-rose-500 text-white text-xs font-bold px-4 py-1.5 rounded-full shadow-sm transition-all duration-200">
                    🔴 กล้องปิดอยู่ (คลิกเปิด)
                </button>
            </div>
            <div class="relative w-full bg-slate-900 rounded-xl overflow-hidden aspect-[4/3] border border-slate-200 shadow-inner flex items-center justify-center">
                <div id="reader" class="w-full h-full object-cover"></div>
                <div id="laser-line" class="hidden absolute left-0 right-0 h-0.5 bg-rose-500 animate-pulse shadow-[0_0_8px_rgba(244,63,94,0.8)]"></div>
            </div>
            <div id="scan-status" class="text-center text-xs font-medium text-slate-400 mt-2.5">💡 แนะนำให้กดปุ่มเปิดกล้องเพื่อเริ่มขายสินค้า</div>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">👤 ลูกค้า / ผู้ซื้อ</label>
                <input type="text" id="customerName" value="ทั่วไป" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 focus:outline-none focus:border-indigo-500 focus:bg-white transition-all">
            </div>
            
            <div class="border-t border-slate-100 my-2"></div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">รหัสสินค้า</label>
                    <input type="text" id="barcode" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-mono font-bold text-slate-700" placeholder="สแกนหรือพิมพ์" onchange="fetchProductData(this.value)">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">ราคา/ชิ้น (฿)</label>
                    <input type="number" id="price" class="w-full p-3 border border-slate-200 rounded-xl text-right font-bold text-indigo-600 focus:outline-none focus:border-indigo-500" placeholder="0.00">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">ชื่อรายการสินค้า</label>
                <input type="text" id="productName" class="w-full p-3 border border-slate-200 rounded-xl text-slate-700 focus:outline-none focus:border-indigo-500" placeholder="ระบุชื่อสินค้า">
            </div>
            <div class="flex space-x-2">
                <div class="w-1/3">
                    <input type="number" id="quantity" value="1" min="1" class="w-full p-3 border border-slate-200 rounded-xl text-center font-bold text-slate-700">
                </div>
                <button type="button" onclick="addToCart()" class="w-2/3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition transform active:scale-95">
                    ➕ เพิ่มลงในบิล
                </button>
            </div>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-3">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">🛒 รายการสินค้าในบิล</h3>
                <button onclick="clearCart()" class="text-xs text-rose-500 hover:underline">ล้างทั้งหมด</button>
            </div>
            <div id="cart-list" class="space-y-2 max-h-40 overflow-y-auto divide-y divide-slate-50 pr-1 text-sm">
                <p class="text-slate-400 text-center py-4 text-xs">ไม่มีสินค้าในตะกร้า</p>
            </div>
            <div class="bg-emerald-50/50 border border-emerald-100 p-3 rounded-xl flex justify-between items-center mt-2">
                <span class="text-xs font-bold text-emerald-800">ยอดรวมทั้งสิ้น:</span>
                <span id="grand-total" class="text-2xl font-black text-emerald-600">0.00 ฿</span>
            </div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
            <select id="payment" class="w-full p-3 border border-slate-200 rounded-xl bg-white font-medium text-xs text-slate-700 focus:outline-none focus:border-indigo-500">
                <option value="โอนเงิน">💸 โอนเงินผ่านธนาคาร</option>
                <option value="เงินสด">💵 เงินสด</option>
                <option value="ยังไม่ได้ชำระเงิน">🚨 ยังไม่ได้ชำระเงิน (ติดหนี้ไว้ก่อน)</option>
            </select>
            <button type="button" id="checkoutBtn" onclick="submitOrder()" disabled 
                class="w-full bg-slate-300 text-slate-500 font-bold py-4 rounded-xl text-base shadow-sm cursor-not-allowed transition-all duration-200">
                🚀 ยืนยันการขาย (บันทึกข้อมูล)
            </button>
        </div>
    </div>

    <div id="reportModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-end justify-center transition-all duration-300">
        <div class="bg-white w-full max-w-md rounded-t-3xl max-h-[85vh] flex flex-col shadow-2xl animate-slide-up">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-3xl">
                <h2 id="modalTitle" class="font-bold text-sm text-slate-700">รายงาน</h2>
                <button onclick="closeModal()" class="w-8 h-8 bg-slate-200 hover:bg-slate-300 text-slate-500 rounded-full font-bold flex items-center justify-center transition">✕</button>
            </div>
            <div id="modalContent" class="p-4 overflow-y-auto flex-1 space-y-3 text-xs"></div>
        </div>
    </div>

    <div id="successToast" class="hidden fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-slate-900/90 text-white px-6 py-5 rounded-2xl flex flex-col items-center justify-center space-y-2 z-50 shadow-2xl backdrop-blur-md border border-white/10 transition-all duration-300 max-w-[200px] text-center">
        <div class="w-12 h-12 bg-emerald-500 rounded-full flex items-center justify-center text-xl font-bold animate-bounce">✓</div>
        <div class="font-bold text-sm" id="toastMessage">บันทึกสำเร็จ</div>
    </div>

    <script>
        // ⚠️ วาง URL ของ Google Apps Script ของคุณที่นี่ (ลงท้ายด้วย /exec)
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx92ov484ob-O4ncwwjpzhD2E5wgwmuhAguCRD8gBiVpyhCiyqLru0LTCqlnHjwHhtFvg/exec"; 
        
        let cart = [];
        let html5Qrcode = null;
        let isCameraOpen = false;
        let audioCtx = null;
        let isProcessing = false;

        function unlockAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playBeepSound() {
            try {
                unlockAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) { console.log(e); }
        }

        // ฟังก์ชันแสดงการแจ้งเตือนแบบสวยงามแทนคำสั่ง alert
        function showSuccessToast(message) {
            const toast = document.getElementById('successToast');
            document.getElementById('toastMessage').innerText = message;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2000); // แสดงผล 2 วินาทีแล้วหายไปเอง
        }

        // 🛠️ ปรับแต่งโหมดเปิดกล้องให้เสถียรที่สุดสำหรับระบบ iOS (iPhone/Safari)
        function startCamera() {
            document.getElementById('scan-status').innerText = "⏳ กำลังเปิดกล้องหลังแบบเสถียร...";
            isProcessing = false;
            html5Qrcode = new Html5Qrcode("reader");
            
            // ล็อกคอนสเตรนวิดีโอแบบขนาดพอดี ไม่ให้ชิปวิดีโอ iOS ค้างชะงัก
            const videoConstraints = {
                facingMode: "environment",
                width: { min: 640, ideal: 640, max: 1024 },
                height: { min: 480, ideal: 480, max: 768 }
            };

            html5Qrcode.start(
                videoConstraints, 
                { fps: 15, qrbox: { width: 250, height: 130 } }, 
                onScanSuccess, 
                () => {}
            )
            .then(() => {
                isCameraOpen = true;
                document.getElementById('laser-line').classList.remove('hidden');
                document.getElementById('cameraToggleBtn').innerText = "🟢 เปิดอยู่ (คลิกปิด)";
                document.getElementById('cameraToggleBtn').className = "bg-emerald-500 text-white text-xs font-bold px-4 py-1.5 rounded-full shadow-sm";
                document.getElementById('scan-status').innerText = "🎯 เล็งบาร์โค้ดให้อยู่ในกรอบเลนส์";
            }).catch(err => {
                document.getElementById('scan-status').innerText = "❌ ไม่สามารถเปิดกล้องได้ กรุณากดใหม่อีกครั้ง";
            });
        }

        function stopCamera() {
            if (html5Qrcode && isCameraOpen) {
                html5Qrcode.stop().then(() => {
                    isCameraOpen = false;
                    document.getElementById('laser-line').classList.add('hidden');
                    document.getElementById('reader').innerHTML = "";
                    document.getElementById('cameraToggleBtn').innerText = "🔴 ปิดอยู่ (คลิกเปิด)";
                    document.getElementById('cameraToggleBtn').className = "bg-rose-500 text-white text-xs font-bold px-4 py-1.5 rounded-full shadow-sm";
                    document.getElementById('scan-status').innerText = "💡 พร้อมเปิดกล้องใหม่อีกครั้ง";
                }).catch(e => console.log(e));
            }
        }

        function toggleCamera() { isCameraOpen ? stopCamera() : startCamera(); }

        // เมื่อสแกนติดสำเร็จ (แก้ปัญหาดับภาพค้างบน iOS)
        function onScanSuccess(decodedText) { 
            if (isProcessing) return;
            isProcessing = true;

            playBeepSound();
            if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
            
            document.getElementById('barcode').value = decodedText; 
            fetchProductData(decodedText); 

            // ปรับดีเลย์เล็กน้อยก่อนปิดสัญญาณวิดีโอ เพื่อให้ iOS ทำงานลื่นไหล
            setTimeout(() => {
                stopCamera();
                showSuccessToast("สแกนรหัสติดแล้ว!");
            }, 250);
        }

        // ระบบจัดการฟอร์มและตะกร้าสินค้า (UI ใหม่เรียบหรู)
        function fetchProductData(bc) { 
            if(!bc) return; 
            document.getElementById('productName').value = "⏳ กำลังค้นหาข้อมูลสินค้า..."; 
            fetch(`${WEB_APP_URL}?barcode=${bc}`).then(r=>r.json()).then(d=>{ 
                if(d.found){ 
                    document.getElementById('productName').value = d.name; 
                    document.getElementById('price').value = d.price; 
                } else { 
                    document.getElementById('productName').value = "ไม่พบคลังสินค้า (สามารถพิมพ์ตั้งชื่อเองได้)"; 
                } 
            }); 
        }

        function addToCart() { 
            const b = document.getElementById('barcode').value, n = document.getElementById('productName').value, p = parseFloat(document.getElementById('price').value), q = parseInt(document.getElementById('quantity').value); 
            if(!b || !n || isNaN(p)) { showSuccessToast("กรอกข้อมูลไม่ครบ!"); return; } 
            cart.push({barcode:b, name:n, price:p, quantity:q}); 
            updateCartUI(); 
            document.getElementById('barcode').value=""; document.getElementById('productName').value=""; document.getElementById('price').value=""; 
            showSuccessToast("เพิ่มลงบิลสำเร็จ");
        }

        function updateCartUI() { 
            const list = document.getElementById('cart-list'); let html = "", total = 0; 
            cart.forEach((item, i) => { 
                total += (item.price * item.quantity); 
                html += `<div class="flex justify-between items-center py-2 text-slate-700 font-medium"><div class="truncate"><div class="font-bold">${item.name}</div><div class="text-[11px] text-slate-400 font-mono">${item.barcode} | ${item.price} ฿ × ${item.quantity}</div></div><span class="font-bold text-slate-800">${(item.price * item.quantity).toFixed(2)} ฿</span></div>`; 
            }); 
            list.innerHTML = cart.length ? html : "<p class='text-slate-400 text-center py-4 text-xs'>ไม่มีสินค้าในตะกร้า</p>"; 
            document.getElementById('grand-total').innerText = total.toFixed(2) + " ฿"; 
            document.getElementById('checkoutBtn').disabled = !cart.length; 
            document.getElementById('checkoutBtn').className = cart.length ? "w-full bg-indigo-600 text-white font-bold py-4 rounded-xl text-base shadow-md active:scale-95 transition-all duration-150 cursor-pointer" : "w-full bg-slate-300 text-slate-500 font-bold py-4 rounded-xl text-base shadow-sm cursor-not-allowed"; 
        }

        function clearCart() { cart = []; updateCartUI(); }

        function submitOrder() { 
            if(!cart.length) return; 
            const cust = document.getElementById('customerName').value.trim(); 
            const pay = document.getElementById('payment').value; 
            if(pay === "ยังไม่ได้ชำระเงิน" && cust === "ทั่วไป") { showSuccessToast("กรุณาใส่ชื่อผู้ค้างจ่าย!"); return; } 
            
            document.getElementById('checkoutBtn').disabled = true; 
            document.getElementById('checkoutBtn').innerText = "⏳ กำลังส่งข้อมูลเข้าคลัง Sheet..."; 

            fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ payment: pay, customer: cust, items: cart }) }) 
            .then(() => { 
                showSuccessToast("🎉 บันทึกยอดขายสำเร็จ!"); 
                clearCart(); 
                document.getElementById('customerName').value = "ทั่วไป"; 
            }).finally(() => { 
                document.getElementById('checkoutBtn').innerText = "🚀 ยืนยันการขาย (บันทึกข้อมูล)"; 
                updateCartUI();
            }); 
        }

        // ระบบแสดงรายงานใน Pop-up รูปแบบใหม่ (รายวัน / ค้างชำระ)
        function openHistoryModal() { 
            showModal("📊 รายงานสรุปยอดขายรายวัน", "<p class='text-center py-4 text-slate-400 animate-pulse'>⏳ กำลังเชื่อมโยง Google Sheet...</p>"); 
            fetch(`${WEB_APP_URL}?action=getHistory`).then(r=>r.json()).then(data => { 
                const grouped = {}; data.forEach(i => { if(!grouped[i.date]) grouped[i.date] = {items:[], total:0}; grouped[i.date].items.push(i); grouped[i.date].total += i.total; }); 
                let html = ""; for(const d in grouped) { 
                    html += `<div class="bg-slate-50 border border-slate-200/60 p-3 rounded-xl mb-2 shadow-sm"><div class="flex justify-between font-bold border-b border-slate-200/50 pb-1.5 text-slate-700 text-xs"><span>📅 ${d}</span><span class="text-indigo-600">รวม: ${grouped[d].total.toFixed(2)} ฿</span></div><div class="divide-y divide-slate-100 max-h-32 overflow-y-auto">`; 
                    grouped[d].items.forEach(i => { html += `<div class="flex justify-between py-1.5 text-slate-600 text-[11px]"><span>[${i.time}] ${i.name} (${i.customer})</span><span class="font-bold">${i.total.toFixed(2)} ฿ <span class="font-normal text-[10px] ${i.payment === 'ยังไม่ได้ชำระเงิน' ? 'text-rose-500' : 'text-slate-400'}">(${i.payment})</span></span></div>`; }); 
                    html += `</div></div>`; 
                } 
                document.getElementById('modalContent').innerHTML = html || "ไม่มีประวัติการขายในคลัง"; 
            }); 
        }

        function openUnpaidModal() { 
            showModal("🚨 รายชื่อลูกค้าค้างจ่ายเงิน", "<p class='text-center py-4 text-slate-400 animate-pulse'>⏳ กำลังประมวลผลยอดค้างจ่าย...</p>"); 
            fetch(`${WEB_APP_URL}?action=getHistory`).then(r=>r.json()).then(data => { 
                const unpaid = data.filter(i => i.payment === "ยังไม่ได้ชำระเงิน"); 
                const debts = {}; unpaid.forEach(i => { if(!debts[i.customer]) debts[i.customer] = {total:0, list:[]}; debts[i.customer].total += i.total; debts[i.customer].list.push(i); }); 
                let html = ""; for(const c in debts) { 
                    html += `<div class="bg-rose-50/70 border border-rose-100 p-3 rounded-xl mb-2"><div class="flex justify-between font-bold text-rose-900 border-b border-rose-100 pb-1.5 text-xs"><span>👤 คุณ ${c}</span><span class="bg-white border border-rose-200 px-2 py-0.5 rounded-md text-rose-600 font-black">ค้าง: ${debts[c].total.toFixed(2)} ฿</span></div><div class="text-[10px] text-slate-500 pt-1 space-y-0.5">`; 
                    debts[c].list.forEach(i => { html += `<div>• ${i.date} - ${i.name} (${i.total} ฿)</div>`; }); 
                    html += `</div></div>`; 
                } 
                document.getElementById('modalContent').innerHTML = html || "🎉 ยอดเยี่ยม! ไม่มีคนติดค้างเงินในระบบ"; 
            }); 
        }

        function showModal(title, text) { document.getElementById('reportModal').classList.remove('hidden'); document.getElementById('modalTitle').innerText = title; document.getElementById('modalContent').innerHTML = text; }
        function closeModal() { document.getElementById('reportModal').classList.add('hidden'); }
    </script>
</body>
</html>
