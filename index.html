<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบ POS สแกนดึงข้อมูลด่วน</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen pb-24">

    <div class="bg-blue-600 text-white p-4 text-center text-lg font-bold shadow-md sticky top-0 z-50">
        🛒 หน้าจอมือถือ - ค้นหาและบันทึกอัตโนมัติ
    </div>

    <div class="max-w-md mx-auto p-3 space-y-3">

        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200">
            <div id="reader" class="w-full bg-black rounded-lg overflow-hidden min-h-[200px]"></div>
            <div id="scan-status" class="mt-2 text-center text-xs font-semibold text-slate-500">
                [ แฟลชสแกนบาร์โค้ดสินค้าได้ที่นี่ ]
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">รหัสบาร์โค้ด</label>
                <div class="flex space-x-2">
                    <input type="text" id="barcode" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-mono text-sm" placeholder="สแกนหรือพิมพ์">
                    <button type="button" onclick="fetchProductData(document.getElementById('barcode').value)" class="bg-slate-200 px-3 rounded-lg text-xs font-bold text-slate-700">ค้นหา</button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">ชื่อสินค้า</label>
                <input type="text" id="productName" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50" placeholder="ชื่อสินค้าจะแสดงอัตโนมัติ">
            </div>
            
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">ราคา/ชิ้น (บาท)</label>
                    <input type="number" id="price" class="w-full p-2.5 border border-slate-300 rounded-lg text-right font-bold text-blue-600" placeholder="0.00" min="0">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">จำนวนชิ้น</label>
                    <input type="number" id="quantity" value="1" min="1" class="w-full p-2.5 border border-slate-300 rounded-lg text-center font-bold">
                </div>
            </div>

            <button type="button" onclick="addToCart()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-lg text-sm transition shadow-sm">
                ➕ เพิ่มลงรายการสินค้า
            </button>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <h3 class="text-sm font-bold text-slate-700 border-b pb-2 flex justify-between">
                <span>📋 รายการซื้อในบิลนี้</span>
                <button onclick="clearCart()" class="text-xs text-red-500 font-normal">ล้างทั้งหมด</button>
            </h3>
            
            <div id="cart-list" class="space-y-2 max-h-48 overflow-y-auto divide-y divide-slate-100">
                <p class="text-slate-400 text-xs text-center py-4">ยังไม่มีสินค้าในตะกร้า</p>
            </div>

            <div class="bg-slate-50 p-3 rounded-lg flex justify-between items-center border border-slate-200 mt-2">
                <span class="text-sm font-bold text-slate-600">ยอดรวมทั้งสิ้น:</span>
                <span id="grand-total" class="text-2xl font-black text-emerald-600">0.00 ฿</span>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <select id="payment" class="w-full p-3 border border-slate-300 rounded-lg bg-white text-sm font-medium">
                <option value="โอนเงิน">💸 โอนเงินผ่านธนาคาร / QR Code</option>
                <option value="เงินสด">💵 เงินสด</option>
            </select>

            <button type="button" id="checkoutBtn" onclick="submitOrder()" disabled
                class="w-full bg-slate-400 text-white font-bold py-4 rounded-xl text-lg shadow-md transition cursor-not-allowed">
                🛍️ ยืนยันยอดขาย & ส่งเข้า Google Sheet
            </button>
        </div>

    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx92ov484ob-O4ncwwjpzhD2E5wgwmuhAguCRD8gBiVpyhCiyqLru0LTCqlnHjwHhtFvg/exec"; 
        let cart = [];

        // ------------------ ระบบสแกนกล้อง ------------------
        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 12, 
            qrbox: { width: 260, height: 140 },
            rememberLastUsedCamera: true,
            supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
        });

        function onScanSuccess(decodedText) {
            if (navigator.vibrate) navigator.vibrate(80); 
            document.getElementById('barcode').value = decodedText;
            document.getElementById('scan-status').innerHTML = "🔍 กำลังดึงข้อมูลรหัส: <span class='text-blue-600 font-bold'>" + decodedText + "</span>";
            
            // เรียกฟังก์ชันไปดึงข้อมูลจาก Google Sheets ทันทีที่สแกนเจอ
            fetchProductData(decodedText);
        }
        html5QrcodeScanner.render(onScanSuccess, () => {});

        // ------------------ ดึงข้อมูลสินค้าจาก Google Sheet ------------------
        function fetchProductData(barcode) {
            if(!barcode) return;
            
            document.getElementById('productName').value = "⏳ กำลังค้นหาข้อมูล...";
            document.getElementById('price').value = "";

            // ส่งค่าไปค้นหาด้วยวิธี GET 
            fetch(`${WEB_APP_URL}?barcode=${barcode}`)
            .then(response => response.json())
            .then(data => {
                if (data.found) {
                    document.getElementById('productName').value = data.name;
                    document.getElementById('price').value = data.price;
                    document.getElementById('scan-status').innerHTML = "✅ พบสินค้า: <span class='text-green-600 font-bold'>" + data.name + "</span>";
                } else {
                    document.getElementById('productName').value = "❌ ไม่พบสินค้าในระบบ";
                    document.getElementById('productName').focus();
                    document.getElementById('scan-status').innerHTML = "<span class='text-red-500 font-bold'>ไม่พบสินค้านี้ในระบบ คุณสามารถพิมพ์ชื่อและใส่ราคาเองได้</span>";
                }
            })
            .catch(err => {
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อคลังข้อมูล");
                document.getElementById('productName').value = "";
            });
        }

        // ------------------ ตะกร้าสินค้า ------------------
        function addToCart() {
            const barcode = document.getElementById('barcode').value.trim();
            const name = document.getElementById('productName').value.trim();
            const price = parseFloat(document.getElementById('price').value);
            const quantity = parseInt(document.getElementById('quantity').value);

            if (!barcode || !name || isNaN(price) || price < 0 || quantity <= 0 || name.includes("กำลังค้นหา")) {
                alert("กรุณากรอกข้อมูลสินค้าให้สมบูรณ์ก่อนเพิ่มลงรายการครับ");
                return;
            }

            cart.push({ barcode, name, price, quantity });
            
            // ล้างฟอร์ม
            document.getElementById('barcode').value = "";
            document.getElementById('productName').value = "";
            document.getElementById('price').value = "";
            document.getElementById('quantity').value = "1";
            document.getElementById('scan-status').innerText = "[ แฟลชสแกนบาร์โค้ดสินค้าได้ที่นี่ ]";
            
            updateCartUI();
        }

        function updateCartUI() {
            const cartList = document.getElementById('cart-list');
            const grandTotalText = document.getElementById('grand-total');
            const checkoutBtn = document.getElementById('checkoutBtn');
            
            if (cart.length === 0) {
                cartList.innerHTML = `<p class="text-slate-400 text-xs text-center py-4">ยังไม่มีสินค้าในตะกร้า</p>`;
                grandTotalText.innerText = "0.00 ฿";
                checkoutBtn.disabled = true;
                checkoutBtn.className = "w-full bg-slate-400 text-white font-bold py-4 rounded-xl text-lg shadow-md cursor-not-allowed";
                return;
            }

            let html = "";
            let grandTotal = 0;

            cart.forEach((item, index) => {
                const totalItemPrice = item.price * item.quantity;
                grandTotal += totalItemPrice;
                html += `
                    <div class="flex justify-between items-center text-sm py-2">
                        <div class="truncate pr-2">
                            <span class="font-bold text-slate-800">${item.name}</span>
                            <div class="text-xs text-slate-500 font-mono">${item.barcode} | ${item.price.toFixed(2)} ฿ × ${item.quantity} ชิ้น</div>
                        </div>
                        <div class="flex items-center space-x-3 flex-shrink-0">
                            <span class="font-bold text-slate-800">${totalItemPrice.toFixed(2)} ฿</span>
                            <button onclick="removeItem(${index})" class="text-red-400 text-xs font-bold">❌</button>
                        </div>
                    </div>
                `;
            });

            cartList.innerHTML = html;
            grandTotalText.innerText = grandTotal.toFixed(2) + " ฿";
            
            checkoutBtn.disabled = false;
            checkoutBtn.className = "w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl text-lg shadow-md active:scale-95 transition cursor-pointer";
        }

        function removeItem(index) { cart.splice(index, 1); updateCartUI(); }
        function clearCart() { cart = []; updateCartUI(); }

        // ------------------ ส่งข้อมูลทั้งหมดเข้า Google Sheet ------------------
        function submitOrder() {
            if (cart.length === 0) return;

            const checkoutBtn = document.getElementById('checkoutBtn');
            checkoutBtn.disabled = true;
            checkoutBtn.innerText = "⏳ กำลังบันทึกบิลขาย...";

            const payload = {
                payment: document.getElementById('payment').value,
                items: cart
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert("🎉 บันทึกยอดขายและตัดบิลสำเร็จแล้ว!");
                clearCart();
            })
            .catch(error => {
                alert("❌ เกิดข้อผิดพลาด: " + error);
            })
            .finally(() => {
                checkoutBtn.disabled = false;
                checkoutBtn.innerText = "🛍️ ยืนยันยอดขาย & ส่งเข้า Google Sheet";
            });
        }
    </script>
</body>
</html>
