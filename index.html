<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบ POS มือถือ + ดูยอดรายวัน</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen pb-24">

    <div class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md sticky top-0 z-40">
        <span class="font-bold text-base">🛒 เครื่องคิดเงินมือถือ</span>
        <button onclick="openHistoryModal()" class="bg-blue-800 hover:bg-blue-900 text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition">
            📊 ประวัติยอดขาย
        </button>
    </div>

    <div class="max-w-md mx-auto p-3 space-y-3">
        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200">
            <div id="reader" class="w-full bg-black rounded-lg overflow-hidden min-h-[180px]"></div>
            <div id="scan-status" class="mt-2 text-center text-xs font-semibold text-slate-500">[ แฟลชสแกนบาร์โค้ด ]</div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="barcode" class="p-2 bg-slate-50 border rounded-lg text-xs" placeholder="บาร์โค้ด">
                <input type="number" id="price" class="p-2 border rounded-lg text-xs text-right font-bold" placeholder="ราคา">
            </div>
            <input type="text" id="productName" class="w-full p-2 border rounded-lg text-xs" placeholder="ชื่อสินค้า">
            <div class="flex space-x-2">
                <input type="number" id="quantity" value="1" min="1" class="w-1/2 p-2 border rounded-lg text-center font-bold text-xs">
                <button type="button" onclick="addToCart()" class="w-1/2 bg-blue-500 text-white text-xs font-bold rounded-lg">➕ เพิ่มรายการ</button>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2">
            <h3 class="text-xs font-bold text-slate-700 flex justify-between"><span>📋 รายการในบิลนี้</span><button onclick="clearCart()" class="text-red-500 font-normal">ล้างตะกร้า</button></h3>
            <div id="cart-list" class="text-xs space-y-1 max-h-32 overflow-y-auto"></div>
            <div class="bg-slate-50 p-2 rounded flex justify-between items-center text-sm font-bold"><span>ยอดรวม:</span><span id="grand-total" class="text-emerald-600 text-lg">0.00 ฿</span></div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2">
            <select id="payment" class="w-full p-2.5 border rounded-lg text-xs bg-white"><option value="โอนเงิน">💸 โอนเงิน</option><option value="เงินสด">💵 เงินสด</option></select>
            <button type="button" id="checkoutBtn" onclick="submitOrder()" disabled class="w-full bg-slate-400 text-white font-bold py-3 rounded-xl text-sm shadow cursor-not-allowed">🛍️ ยืนยันการขาย</button>
        </div>
    </div>

    <div id="historyModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity duration-300">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[85vh] flex flex-col shadow-xl">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <h2 class="font-bold text-slate-800 flex items-center gap-1">📊 ประวัติยอดขายรายวัน</h2>
                <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold p-1">✕</button>
            </div>
            <div id="history-content" class="p-4 overflow-y-auto flex-1 space-y-4 text-sm">
                <p class="text-center text-slate-400 py-8">⏳ กำลังโหลดข้อมูลประวัติ...</p>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx92ov484ob-O4ncwwjpzhD2E5wgwmuhAguCRD8gBiVpyhCiyqLru0LTCqlnHjwHhtFvg/exec"; 
        let cart = [];

        // [ คงฟังก์ชันเดิมทั้งหมดไว้: ระบบสแกนกล้องหลัง, fetchProductData, addToCart, updateCartUI, submitOrder ]
        // เพื่อให้ตัวอย่างนี้พร้อมใช้งานรันได้ทันที ผมใส่ฟังก์ชันควบคุมกล้องและตะกร้าหลักไว้ให้ครับ:
        const html5Qrcode = new Html5Qrcode("reader");
        html5Qrcode.start({ facingMode: "environment" }, { fps: 12, qrbox: { width: 250, height: 130 } }, onScanSuccess, () => {});
        function onScanSuccess(text) { document.getElementById('barcode').value = text; fetchProductData(text); }
        function fetchProductData(bc) { fetch(`${WEB_APP_URL}?barcode=${bc}`).then(r=>r.json()).then(d=>{ if(d.found){ document.getElementById('productName').value=d.name; document.getElementById('price').value=d.price; } }); }
        function addToCart() { const b=document.getElementById('barcode').value, n=document.getElementById('productName').value, p=parseFloat(document.getElementById('price').value), q=parseInt(document.getElementById('quantity').value); if(!b||!n||isNaN(p)) return; cart.push({barcode:b,name:n,price:p,quantity:q}); updateCartUI(); document.getElementById('barcode').value=""; document.getElementById('productName').value=""; document.getElementById('price').value=""; }
        function updateCartUI() { const l=document.getElementById('cart-list'); let h="", t=0; cart.forEach((item,i)=>{ t+=(item.price*item.quantity); h+=`<div class='flex justify-between py-1 border-b text-xs'><span>${item.name} x${item.quantity}</span><span>${(item.price*item.quantity).toFixed(2)} ฿</span></div>`; }); l.innerHTML=cart.length?h:"<p class='text-slate-400 text-center'>ไม่มีสินค้า</p>"; document.getElementById('grand-total').innerText=t.toFixed(2)+" ฿"; const btn=document.getElementById('checkoutBtn'); btn.disabled=!cart.length; btn.className=cart.length?"w-full bg-emerald-500 text-white font-bold py-3 rounded-xl text-sm shadow":"w-full bg-slate-400 text-white font-bold py-3 rounded-xl text-sm shadow cursor-not-allowed"; }
        function clearCart() { cart=[]; updateCartUI(); }
        function submitOrder() { if(!cart.length)return; fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({payment:document.getElementById('payment').value,items:cart})}).then(()=>{ alert("บันทึกสำเร็จ!"); clearCart(); }); }

        // ----------------------------------------------------
        // ระบบดึงข้อมูลประวัติการขายแยกตามวัน (ฟังก์ชันใหม่)
        // ----------------------------------------------------
        function openHistoryModal() {
            const modal = document.getElementById('historyModal');
            const content = document.getElementById('history-content');
            modal.classList.remove('hidden');
            content.innerHTML = `<p class="text-center text-slate-400 py-8">⏳ กำลังดึงข้อมูลจาก Google Sheets...</p>`;

            // ส่ง Request ไปดึงประวัติการขายด้วย action=getHistory
            fetch(`${WEB_APP_URL}?action=getHistory`)
            .then(response => response.json())
            .then(data => {
                if (data.length === 0) {
                    content.innerHTML = `<p class="text-center text-slate-400 py-8">ยังไม่มีประวัติการขายในระบบ</p>`;
                    return;
                }

                // จัดกลุ่มข้อมูลสินค้าตาม "วันที่ขาย"
                const groupedData = {};
                data.forEach(item => {
                    if (!groupedData[item.date]) {
                        groupedData[item.date] = { items: [], dayTotal: 0 };
                    }
                    groupedData[item.date].items.push(item);
                    groupedData[item.date].dayTotal += item.total;
                });

                // สร้าง HTML แสดงผลรายวัน
                let htmlOutput = "";
                for (const date in groupedData) {
                    htmlOutput += `
                        <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-2 shadow-sm">
                            <div class="flex justify-between items-center border-b pb-2">
                                <span class="font-bold text-slate-700 text-xs">📅 ยอดขายวันที่: ${date}</span>
                                <span class="font-black text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded text-xs border border-emerald-200">รวม: ${groupedData[date].dayTotal.toFixed(2)} ฿</span>
                            </div>
                            <div class="divide-y divide-slate-100 max-h-40 overflow-y-auto pr-1">
                    `;

                    groupedData[date].items.forEach(item => {
                        htmlOutput += `
                            <div class="flex justify-between items-center text-xs py-1.5">
                                <div class="truncate max-w-[70%]">
                                    <span class="text-slate-400 font-mono text-[10px]">[${item.time}]</span>
                                    <span class="font-medium text-slate-800 ml-1">${item.name}</span>
                                    <div class="text-[10px] text-slate-400 font-mono pl-9">รหัส: ${item.barcode} | วิธีชำระ: ${item.payment}</div>
                                </div>
                                <span class="font-bold text-slate-600 text-right font-mono">${item.price}x${item.quantity} = ${item.total.toFixed(2)} ฿</span>
                            </div>
                        `;
                    });

                    htmlOutput += `
                            </div>
                        </div>
                    `;
                }
                content.innerHTML = htmlOutput;
            })
            .catch(err => {
                content.innerHTML = `<p class="text-center text-red-500 py-8">❌ เกิดข้อผิดพลาดในการโหลดข้อมูล</p>`;
                console.error(err);
            });
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').classList.add('hidden');
        }
    </script>
</body>
</html>
